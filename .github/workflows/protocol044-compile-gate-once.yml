name: Protocol044 compile gate once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol044-compile-gate-once.yml']
permissions:
  contents: read
jobs:
  compile:
    if: contains(github.event.head_commit.message, '[p044-compile]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/protocol-044-closeout-capacity-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
      - name: Compile current Protocol044 core
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          python -m pip install numpy==1.24.4 psutil==5.9.8 dill==0.3.8
          python -m py_compile protocol044_common.py protocol044_engine.py reference_protocol036_locked.py reference_protocol036_stream_locked.py reference_protocol043_runner_locked.py run_ftmoe_protocol037.py run_ftmoe_protocol040.py run_ftmoe_protocol039.py protocol035_common.py run_ftmoe_protocol031_pilot.py run_ftmoe_protocol033.py run_ftmoe_protocol035.py run_ftmoe_protocol044.py maintenance/protocol044_source_probe.py maintenance/protocol044_audit043.py protocol044_stream.py
          python -c "import protocol044_common, protocol044_engine, run_ftmoe_protocol044, protocol044_stream; import importlib.util, pathlib; p=pathlib.Path('maintenance/protocol044_audit043.py'); spec=importlib.util.spec_from_file_location('p044_audit043',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('Protocol044 imports OK')"
          python -c "import hashlib,json,pathlib; p=pathlib.Path('artifacts/ftmoe_online/protocol_044/plan.json'); h=hashlib.sha256(p.read_bytes()).hexdigest(); assert h=='a27a6cca6abde40b6395876eccd3db5f550a044e952a701fe63aa2e4306a5f51'; x=json.loads(p.read_text()); assert (x['protocol'],x['revision'])==('044',1); assert x['stageS']['sequence_order']==['C_ref','D_lin','D_no_gc','D_bounded']; print(h)"

