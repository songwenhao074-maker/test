name: Protocol042 exhaustive U tolerance audit once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol042-u-tolerance-audit-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: contains(github.event.head_commit.message, '[p042r2-u-tol-audit]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da5eaa7e71f44497ede538c884e7ca688e6afbf4
      - name: Exhaustively verify structural equality and preregistered float tolerance
        shell: bash
        run: |
          set -euo pipefail
          for X in "11274660283 69190b023b4c0c2d9dfea3f2e5f84f0075f016298b047ed72a86395831d0a6b1 /tmp/u042.zip /tmp/u042"                    "11269043834 baa36f1fbb3489f76d8f0ffb5d8e4ebc88317e231bd934146e185ac2e4ffde6e /tmp/u041.zip /tmp/u041"; do
            set -- $X
            curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" -o "$3"
            echo "$2  $3" | sha256sum -c -
            rm -rf "$4"; mkdir -p "$4"; unzip -q "$3" -d "$4"
          done
          python - <<'PY'
          import json, math, pathlib, sys
          R=pathlib.Path('/tmp/u042/U_parent'); O=pathlib.Path('/tmp/u041/W_parent')
          specs={
            'birth_checks':('checks','birth_checks.json'),
            'candidate_decisions':('decisions','candidate_decisions.json'),
            'initialization_events':('events','initialization_events.json'),
            'lifecycle_events':('events','lifecycle_events.json'),
            'opportunity_log':('opportunities','opportunity_log.json'),
            'pressure_checks':('checks','pressure_checks.json'),
            'reuse_decisions':('decisions','reuse_decisions.json'),
            'sleep_checks':('checks','sleep_checks.json'),
            'update_log':('updates','update_log.json'),
          }
          IGN={'protocol','revision','arm','runtime_seconds','time_unix','action_seq'}
          stats={'numeric_count':0,'max_abs_diff':0.0,'max_path':None,'structural_mismatches':[],'numeric_over_tolerance':[]}
          def walk(a,b,path):
            if isinstance(a,bool) or isinstance(b,bool):
              if type(a) is not type(b) or a!=b: stats['structural_mismatches'].append((path,a,b))
              return
            if isinstance(a,(int,float)) and isinstance(b,(int,float)):
              da=float(a); db=float(b)
              if math.isnan(da) or math.isnan(db):
                if not (math.isnan(da) and math.isnan(db)): stats['structural_mismatches'].append((path,a,b))
                return
              d=abs(da-db); stats['numeric_count']+=1
              if d>stats['max_abs_diff']: stats['max_abs_diff']=d; stats['max_path']=path
              if d>1e-12: stats['numeric_over_tolerance'].append((path,a,b,d))
              return
            if type(a)!=type(b):
              stats['structural_mismatches'].append((path,'TYPE',type(a).__name__,type(b).__name__)); return
            if isinstance(a,dict):
              ka=set(a)-IGN; kb=set(b)-IGN
              if ka!=kb:
                stats['structural_mismatches'].append((path,'KEYS',sorted(ka-kb),sorted(kb-ka))); return
              for k in sorted(ka): walk(a[k],b[k],path+'/'+k)
              return
            if isinstance(a,list):
              if len(a)!=len(b): stats['structural_mismatches'].append((path,'LEN',len(a),len(b))); return
              for i,(x,y) in enumerate(zip(a,b)): walk(x,y,f'{path}[{i}]')
              return
            if a!=b: stats['structural_mismatches'].append((path,a,b))
          for name,(key,fn) in specs.items():
            a=json.load(open(R/fn))[key]; b=json.load(open(O/fn))[key]
            walk(a,b,name)
          # Reproduction report already proves prediction/qualification arrays, hashes and counts exact.
          rep=json.load(open(R/'reproduction_report.json'))
          required_exact=[
            all(rep['prediction_arrays'].values()), rep['expected_counts'],
            rep['final_model_optimizer_hash_exact'], rep['qualification_arrays_exact'], rep['qualification_metric_exact'],
            rep['full_AP_absolute_difference']<=1e-12
          ]
          ok=(not stats['structural_mismatches'] and not stats['numeric_over_tolerance'] and all(required_exact))
          out={'protocol':'042','revision':2,'arm':'U_parent','against':'cached041_W_parent',
               'tolerance':1e-12,'all_pass':bool(ok),'numeric_count':stats['numeric_count'],
               'max_abs_diff':stats['max_abs_diff'],'max_path':stats['max_path'],
               'structural_mismatch_count':len(stats['structural_mismatches']),
               'numeric_over_tolerance_count':len(stats['numeric_over_tolerance']),
               'structural_mismatches':stats['structural_mismatches'][:20],
               'numeric_over_tolerance':stats['numeric_over_tolerance'][:20],
               'prediction_arrays_exact':all(rep['prediction_arrays'].values()),
               'counts_hashes_qualification_exact':all(required_exact[1:4]),
               'full_AP_absolute_difference':rep['full_AP_absolute_difference'],
               'original_gate_all_pass':rep['all_pass'],
               'science_reexecuted':False}
          print(json.dumps(out,indent=2))
          pathlib.Path('/tmp/u_tolerance_report.json').write_text(json.dumps(out,indent=2)+'\n')
          if not ok: sys.exit(2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: protocol042-u-tolerance-audit-${{ github.run_id }}
          path: /tmp/u_tolerance_report.json
          retention-days: 90
