name: Protocol043 dispatch once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol043-dispatch-once.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[p043-dispatch]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact frozen Protocol043 science
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run protocol043-bounded-lifecycle.yml --repo "$GITHUB_REPOSITORY" --ref main -f execution_sha=9d9320cf84ebaf034dca9e8257f0dc82171cc916
          echo "dispatched execution_sha=9d9320cf84ebaf034dca9e8257f0dc82171cc916"
