name: Protocol044 r2 recover orphan 3800 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol044-r2-recover-3800-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  recover:
    if: contains(github.event.head_commit.message, '[p044r2-recover3800]')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTION_SHA: 57ecaadb22dac117f5004c782ad5a27a03d84efc
      EXECUTION_REF: codex/protocol-044-revision2-durable-recovery-20261005
      GATE_ARTIFACT_ID: "11323195440"
      GATE_DIGEST: "sha256:c4af8bc5504c7db65822539134a0f31a580c2b99f0c4746d5912b9fc6dccdeed"
      ORPHAN_STATE_ID: "11332873940"
      PARENT_STATE_ID: "11332456389"
      PARENT_RECEIPT_ID: "11332656059"
      PARENT_RECEIPT_SHA: "f30103da85b8c6c33fbcca2c6d7c0df98ee1dca11d5e3f1b50584c5e13e11d6d"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 57ecaadb22dac117f5004c782ad5a27a03d84efc
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.18"
      - name: Install frozen runtime and source036
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
          echo "a27a6cca6abde40b6395876eccd3db5f550a044e952a701fe63aa2e4306a5f51  artifacts/ftmoe_online/protocol_044/plan.json" | sha256sum -c -
          echo "823365226f0e418bcc5dbdc79e0e1b77f5adf72c3e404b67fb28fdffd9cc20b3  artifacts/ftmoe_online/protocol_044/revision_002/plan.json" | sha256sum -c -
          echo "6e6bd03efc0d84f5e885eacf36f1ac80e770198703463cc051216ad1a741683f  artifacts/ftmoe_online/protocol_044/scenario_registration.json" | sha256sum -c -
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/req.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/req.txt
          python -m pip install dgl==1.1.3 dill==0.3.8 psutil==5.9.8 wget==3.2 pandas==2.0.3 scikit-learn==1.3.2
          git worktree add --detach /tmp/source036 b620467aab4283e52d129924769c374124bbb4bf
      - name: Verify gate and committed 3600 parent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate /tmp/parent /tmp/preceipt
          curl -L --fail --retry 5 --retry-delay 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$GATE_ARTIFACT_ID/zip" -o /tmp/gate.zip
          echo "$GATE_DIGEST" | sed 's/^sha256://' | awk '{print $1"  /tmp/gate.zip"}' | sha256sum -c -
          unzip -q /tmp/gate.zip -d /tmp/gate
          python - <<'PY'
          import json,os
          g=json.load(open("/tmp/gate/E_recovery_gate.json"))
          assert g["E_recovery_gate"] is True and g["fixture_mode"] is False and g["execution_sha"]==os.environ["EXECUTION_SHA"]
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PARENT_STATE_ID" > /tmp/pinfo.json
          PDIG=$(python -c 'import json; print(json.load(open("/tmp/pinfo.json"))["digest"].split(":",1)[1])')
          curl -L --fail --retry 5 --retry-delay 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PARENT_STATE_ID/zip" -o /tmp/parent.zip
          echo "$PDIG  /tmp/parent.zip" | sha256sum -c -
          unzip -q /tmp/parent.zip -d /tmp/parent
          curl -L --fail --retry 5 --retry-delay 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PARENT_RECEIPT_ID/zip" -o /tmp/preceipt.zip
          unzip -q /tmp/preceipt.zip -d /tmp/preceipt
          test "$(sha256sum /tmp/preceipt/receipt.json | awk '{print $1}')" = "$PARENT_RECEIPT_SHA"
          python maintenance/protocol044_r2_durable.py verify --root /tmp/parent --manifest /tmp/parent/state_manifest.json
          python maintenance/protocol044_r2_durable.py verify-receipt --receipt /tmp/preceipt/receipt.json --manifest /tmp/parent/state_manifest.json
          python maintenance/protocol044_r2_durable.py fresh-generation-restore --source036 /tmp/source036 --root /tmp/parent --manifest /tmp/parent/state_manifest.json
          test "$(python -c 'import json; print(json.load(open("/tmp/preceipt/receipt.json"))["next_t"])')" = "3600"
      - name: Recover orphan state and create receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/orphan
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ORPHAN_STATE_ID" > /tmp/oinfo.json
          ODIG=$(python -c 'import json; print(json.load(open("/tmp/oinfo.json"))["digest"].split(":",1)[1])')
          test "$ODIG" = "651fa42760dfdc88df43b0cad2612e463ffc64e5884ffb152fecb01eb7a30a4c"
          curl -L --fail --retry 8 --retry-delay 5 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ORPHAN_STATE_ID/zip" -o /tmp/orphan.zip
          echo "$ODIG  /tmp/orphan.zip" | sha256sum -c -
          unzip -q /tmp/orphan.zip -d /tmp/orphan
          python maintenance/protocol044_r2_durable.py verify --root /tmp/orphan --manifest /tmp/orphan/state_manifest.json --expected-parent "$PARENT_RECEIPT_SHA"
          python maintenance/protocol044_r2_durable.py fresh-generation-restore --source036 /tmp/source036 --root /tmp/orphan --manifest /tmp/orphan/state_manifest.json
          test "$(python -c 'import json; print(json.load(open("/tmp/orphan/state_manifest.json"))["next_t"])')" = "3800"
          python maintenance/protocol044_r2_durable.py receipt --info /tmp/oinfo.json --manifest /tmp/orphan/state_manifest.json --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/receipt.json --parent /tmp/preceipt/receipt.json
          python maintenance/protocol044_r2_durable.py verify-receipt --receipt /tmp/receipt.json --manifest /tmp/orphan/state_manifest.json
      - id: receipt_up
        uses: actions/upload-artifact@v4
        with:
          name: protocol044-r2-gen-receipt-3800-recovered-${{ github.run_id }}
          path: /tmp/receipt.json
          retention-days: 90
          compression-level: 6
      - name: Persist recovered receipt to execution branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXECUTION_REF"
          git worktree add /tmp/progress "origin/$EXECUTION_REF"
          cd /tmp/progress
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          P="artifacts/ftmoe_online/protocol_044/revision_002/progress/generation_cursor_3800.json"
          mkdir -p "$(dirname "$P")"
          if [ -e "$P" ]; then cmp "$P" /tmp/receipt.json; else cp /tmp/receipt.json "$P"; git add "$P"; git commit -m "progress: recover Protocol044 r2 generation cursor 3800 [skip ci]"; git push origin HEAD:"$EXECUTION_REF"; fi
