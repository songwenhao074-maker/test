name: Protocol-029 passive memory-utility diagnostic

on:
  push:
    branches: [protocol-029-memory-utility-20260922]
    paths:
      - .github/workflows/protocol029-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: protocol029-single-diagnostic
  cancel-in-progress: false

jobs:
  protocol029:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
      STREAM_ROOT: artifacts/ftmoe_online/protocol_025/data_seed700
      RUN_DIR: artifacts/ftmoe_online/protocol_029/runtime/run_${{ github.run_id }}
      P029_REG: artifacts/ftmoe_online/protocol_029/registration.json
      METHOD_REG: artifacts/ftmoe_online/protocol_025/method_registration.json
      SOURCE_028_ROOT: /tmp/protocol028-source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install Protocol-029 dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3 dill==0.3.8 psutil

      - name: Compile Protocol-029 diagnostic implementation
        run: |
          python -m py_compile             ftmoe_protocol029_memory_utility.py             run_ftmoe_protocol029_diagnostic.py             finalize_ftmoe_protocol029.py             ftmoe_protocol028_memory_protected.py             ftmoe_protocol027_data.py

      - name: Download exact frozen data from Protocol-027
        uses: actions/download-artifact@v4
        with:
          name: protocol027-frozen-data-35682811782
          path: ${{ env.STREAM_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35682811782

      - name: Verify frozen data unchanged
        run: python ftmoe_protocol027_data.py --data-root "$STREAM_ROOT" --verify-only

      - name: Download complete Protocol-028 evidence
        uses: actions/download-artifact@v4
        with:
          name: protocol028-single-pilot-35705211072
          path: ${{ env.SOURCE_028_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35705211072

      - name: Verify required Protocol-028 source evidence and identities
        run: |
          mkdir -p "$RUN_DIR"
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("/tmp/protocol028-source")
          required=[
            root/"comparison.json",
            root/"D_memory_protected"/"predictions.npz",
            root/"D_memory_protected"/"lifecycle.jsonl",
            root/"D_memory_protected"/"summary.json",
            root/"D_memory_protected"/"lifecycle_summary.json",
            root/"D_memory_protected"/"opportunity_accounting.json",
          ]
          missing=[str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit("missing Protocol028 source evidence: "+", ".join(missing))
          out=pathlib.Path("artifacts/ftmoe_online/protocol_029/runtime")/("run_"+__import__("os").environ["GITHUB_RUN_ID"])
          payload={
            "protocol027_frozen_run_id":35682811782,
            "protocol027_frozen_artifact_id":10675401651,
            "protocol027_frozen_artifact_name":"protocol027-frozen-data-35682811782",
            "protocol027_frozen_artifact_digest":"sha256:111a4c5fc5c508a9e169fdbffe823ee36dc66c037c1775a6aa1abdbaba31c0a1",
            "protocol028_run_id":35705211072,
            "protocol028_artifact_id":10684617851,
            "protocol028_artifact_name":"protocol028-single-pilot-35705211072",
            "protocol028_artifact_digest":"sha256:e3be1c97d0f629c9ed40f61cfd4561b6b04e37b68357a2c92a23ac8f14e2e27e",
            "required_source_files_present":True,
          }
          (out/"source_artifacts.json").write_text(json.dumps(payload,indent=2)+"\n")
          PY

      - name: Re-run inherited data eligibility
        run: |
          python audit_ftmoe_protocol027.py --data-root "$STREAM_ROOT" --output-root "$RUN_DIR"

      - name: Record Protocol-029 execution identity
        run: |
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ["RUN_DIR"])
          payload={
            "protocol":"029",
            "github_run_id":os.environ["GITHUB_RUN_ID"],
            "event":os.environ["GITHUB_EVENT_NAME"],
            "head_sha":os.environ["GITHUB_SHA"],
            "branch":os.environ["GITHUB_REF_NAME"],
            "single_diagnostic_replay":True,
            "rerun_C":False,
            "new_training_arms":0,
            "simulation":False,
          }
          (root/"workflow_execution.json").write_text(json.dumps(payload,indent=2)+"\n")
          PY

      - name: Run only the registered Protocol-029 passive diagnostic replay
        run: |
          python run_ftmoe_protocol029_diagnostic.py             --stream "$STREAM_ROOT"             --out-root "$RUN_DIR"             --method-registration "$METHOD_REG"             --registration "$P029_REG"             --source-028-root "$SOURCE_028_ROOT"             --run-id "$GITHUB_RUN_ID"

      - name: Persist status if diagnostic runner stopped early
        if: always()
        run: |
          python finalize_ftmoe_protocol029.py --status-only             --run-root "$RUN_DIR"             --git-dest "artifacts/ftmoe_online/protocol_029/runs/run_${GITHUB_RUN_ID}"             --run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY"

      - name: Upload complete Protocol-029 evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: protocol029-memory-utility-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}/
          if-no-files-found: warn
          compression-level: 3
          retention-days: 90

      - name: Build Protocol-029 report and compact handoff
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python finalize_ftmoe_protocol029.py             --run-root "$RUN_DIR"             --git-dest "artifacts/ftmoe_online/protocol_029/runs/run_${GITHUB_RUN_ID}"             --run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY"             --artifact-id "$ARTIFACT_ID" --artifact-url "$ARTIFACT_URL"             --artifact-digest "$ARTIFACT_DIGEST"

      - name: Commit compact Protocol-029 results and handoff
        if: always()
        run: |
          git config user.name "protocol029-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             docs/PROTOCOL029_RESULTS.md             docs/GITHUB_EXPERIMENT_HANDOFF.md             AGENTS.md README.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md             artifacts/ftmoe_online/protocol_029/runs/
          git commit -m "results: record Protocol029 passive diagnostic run ${GITHUB_RUN_ID}" || true
          git fetch origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Final Protocol-029 validity gate
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path("artifacts/ftmoe_online/protocol_029/runs")/("run_"+os.environ["GITHUB_RUN_ID"])/"status.json"
          if not p.is_file():
              raise SystemExit("Protocol029 compact status missing")
          s=json.loads(p.read_text())
          print(json.dumps(s,indent=2))
          if not s.get("completed") or not s.get("diagnostic_valid"):
              raise SystemExit("Protocol029 ended with a documented blocker or invalid diagnostic")
          PY
