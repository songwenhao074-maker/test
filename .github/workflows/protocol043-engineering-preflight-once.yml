name: Protocol043 engineering preflight once
# fixture retry 232e859b

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol043-engineering-preflight-once.yml'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    if: contains(github.event.head_commit.message, '[p043-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/protocol-043-bounded-lifecycle-20261003
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.18"

      - name: Install fixed engineering dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          python -m pip install numpy==1.24.4 psutil==5.9.8
          python -m pip freeze > /tmp/p043_pip_freeze.txt
          python maintenance/validate_protocol043_plan.py
          python -m py_compile protocol043_common.py protocol043_engine.py run_ftmoe_protocol043.py analyze_ftmoe_protocol043.py maintenance/protocol043_audit042.py

      - name: Download and verify registered raw artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p043 && mkdir -p /tmp/p043/{zip,extract036,extract041,extract042,source036,source041,engineering}
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11147931152/zip" -o /tmp/p043/zip/036.zip
          echo "040bacac8f23659f56599b71d6d6706b62a544e44161c7c42fb5af73650f56c0  /tmp/p043/zip/036.zip" | sha256sum -c -
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11269043834/zip" -o /tmp/p043/zip/041.zip
          echo "baa36f1fbb3489f76d8f0ffb5d8e4ebc88317e231bd934146e185ac2e4ffde6e  /tmp/p043/zip/041.zip" | sha256sum -c -
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11276470062/zip" -o /tmp/p043/zip/042.zip
          echo "764913d9ffb3e26d2895b1ba802595458b5efdeb46c8bc118c226c2c2c7bc991  /tmp/p043/zip/042.zip" | sha256sum -c -
          unzip -q /tmp/p043/zip/036.zip -d /tmp/p043/extract036
          unzip -q /tmp/p043/zip/041.zip -d /tmp/p043/extract041
          unzip -q /tmp/p043/zip/042.zip -d /tmp/p043/extract042

      - name: Materialize exact sources and verify Protocol042 raw
        shell: bash
        run: |
          set -euo pipefail
          python maintenance/materialize_protocol043_sources.py             --extracted036 /tmp/p043/extract036 --extracted041 /tmp/p043/extract041 --extracted042 /tmp/p043/extract042             --out036 /tmp/p043/source036 --out041 /tmp/p043/source041             --report /tmp/p043/engineering/source_materialization.json

      - name: Read-only full audit of sealed Protocol042
        shell: bash
        run: |
          set -euo pipefail
          python maintenance/protocol043_audit042.py             --raw042 /tmp/p043/extract042             --out /tmp/p043/engineering/audit042

      - name: Run Protocol043 synthetic production preflight
        shell: bash
        run: |
          set -euo pipefail
          python run_ftmoe_protocol043.py preflight             --source036 /tmp/p043/source036             --source041 /tmp/p043/source041             --out-dir /tmp/p043/engineering/preflight

      - name: Build engineering manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/p043/engineering
          cp /tmp/p043_pip_freeze.txt /tmp/p043/engineering/pip_freeze.txt || true
          git rev-parse HEAD > /tmp/p043/engineering/execution_head.txt
          python maintenance/protocol043_finalize.py manifest             --root /tmp/p043/engineering             --out /tmp/p043/engineering/engineering_manifest.json || true

      - name: Upload Protocol043 engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol043-engineering-${{ github.run_id }}
          path: /tmp/p043/engineering
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
