name: Protocol037 exact-resume repair compile check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol037-resume-compile-check-once.yml'

permissions:
  contents: read

jobs:
  check:
    if: contains(github.event.head_commit.message, '[p037-resume-compile-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d3bf89ec91bb5aede9da883c4223d7e35105ff54
          fetch-depth: 1
      - run: python maintenance/validate_protocol037_plan.py
      - run: python -m py_compile run_ftmoe_protocol037.py analyze_ftmoe_protocol037.py maintenance/protocol037_finalize.py
