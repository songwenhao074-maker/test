name: Protocol-038 one-shot dispatcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol038-dispatch-helper.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate locked execution and dispatch exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_REF: codex/protocol-038-birth-initialization-20261001
          EXPECTED_SHA: 7b9aa7891f5f6f435a4ed6f04c2aef56cdd0f405
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(gh api "repos/$GITHUB_REPOSITORY/branches/$EXEC_REF" --jq '.commit.sha')"
          test "$ACTUAL" = "$EXPECTED_SHA"
          python maintenance/validate_protocol038_plan.py
          COUNT="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/protocol038-birth-initialization.yml/runs" -f event=workflow_dispatch -f per_page=20 --jq '.workflow_runs | length')"
          test "$COUNT" = "0"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/protocol038-birth-initialization.yml/dispatches"             -f ref=main             -f "inputs[execution_ref]=$EXEC_REF"             -f "inputs[expected_execution_sha]=$EXPECTED_SHA"             -f "inputs[resume_run_id]="

      - name: Remove one-shot helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/protocol038-dispatch-helper.yml
          git commit -m "ops: remove Protocol038 one-shot dispatcher [skip ci]"
          git push origin HEAD:main
