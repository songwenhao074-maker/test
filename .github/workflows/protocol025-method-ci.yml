name: Protocol-025 frozen method unit tests

on:
  workflow_dispatch:
  push:
    branches: [protocol-025-gpt56-20260916]
    paths:
      - 'ftmoe_protocol025_model.py'
      - 'ftmoe_protocol025_session.py'
      - 'run_ftmoe_protocol025_development.py'
      - 'run_ftmoe_protocol025_equivalence_smoke.py'
      - 'test_ftmoe_protocol025_model.py'
      - 'test_ftmoe_protocol025_session.py'
      - 'artifacts/ftmoe_online/protocol_025/method_registration.json'
      - '.github/workflows/protocol025-method-ci.yml'

permissions:
  contents: read

jobs:
  method-unit-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3
      - name: Verify method registration is frozen before model results
        run: |
          python - <<'PY'
          import json
          m=json.load(open('artifacts/ftmoe_online/protocol_025/method_registration.json'))
          assert m['registered_before_any_model_result'] is True
          assert m['development_seed']==700 and m['model_seed']==1
          assert m['common_observable_input']['residual_input_dim']==73
          assert m['common_observable_input']['extra_shared_trainable_head'] is False
          assert m['comparators']['C_fixed8_top5']['expert_mlp_execution']=='selected_five_only_per_token'
          assert m['evaluation']['active_budget_primary_comparator']=='C_fixed5'
          assert m['confirmation_seeds_forbidden']==[701,702,703]
          assert m['test_seeds_forbidden']==[201,202,203,204,205]
          print({'method_registration':'passed','residual_dim':73,'primary_comparator':'C_fixed5','top5_sparse_mlp':True})
          PY
      - name: Compile and unit-test registered model/session/runner only
        run: |
          python -m py_compile ftmoe_protocol025_model.py ftmoe_protocol025_session.py run_ftmoe_protocol025_development.py run_ftmoe_protocol025_equivalence_smoke.py test_ftmoe_protocol025_model.py test_ftmoe_protocol025_session.py
          python -m unittest -v test_ftmoe_protocol025_model.py test_ftmoe_protocol025_session.py
      - name: Run real-forward engineering equivalence smoke
        run: |
          python run_ftmoe_protocol025_equivalence_smoke.py
      - name: Assert no Protocol025 model result exists yet
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden=['comparison.json','model_status.json','development_results.json']
          root=Path('artifacts/ftmoe_online/protocol_025')
          found=[str(p) for name in forbidden for p in root.rglob(name)]
          assert not found, found
          print({'model_results_seen':False})
          PY
