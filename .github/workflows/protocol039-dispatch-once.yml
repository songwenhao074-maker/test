name: Protocol039 dispatch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol039-dispatch-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[p039-dispatch-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTION_REF: codex/protocol-039-d-vs-c-sleep-wake-20261002
      EXPECTED_SHA: 378fa534b35ac00ab43a5205fe94e103733233c7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify frozen execution branch and registration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXECUTION_REF" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git show FETCH_HEAD:artifacts/ftmoe_online/protocol_039/plan.json | sha256sum | awk '{print $1}')" = "2182aa9c08a2067ea8abb89b70555a8174fc9a2809d0655c59effa4174cd9811"
          test "$(git show FETCH_HEAD:.github/workflows/protocol039-d-vs-c-sleep-wake.yml | git hash-object --stdin)" = "ae60112f202596f63a994887487681c6d6c45554"
      - name: Ensure no prior formal Protocol039 run exists
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/protocol039-d-vs-c-sleep-wake.yml/runs?per_page=20" --jq '.total_count')"
          test "$COUNT" = "0" || { echo "formal Protocol039 run already exists; refusing duplicate dispatch"; exit 1; }
      - name: Dispatch formal Protocol039 once
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/protocol039-d-vs-c-sleep-wake.yml/dispatches"             -F ref=main             -F "inputs[execution_ref]=$EXECUTION_REF"             -F "inputs[expected_execution_sha]=$EXPECTED_SHA"
      - name: Query dispatched run without retrying
        shell: bash
        run: |
          sleep 5
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/protocol039-d-vs-c-sleep-wake.yml/runs?per_page=5"             --jq '.workflow_runs[] | {id,status,conclusion,created_at,html_url,head_sha}'
