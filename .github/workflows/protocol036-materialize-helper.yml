name: Protocol036 workflow condition repair

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  EXECUTION_REF: codex/protocol-036-correction-controls-20260930

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[p036-workflowfix]')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_REF }}
          fetch-depth: 0

      - name: Make seed700 manifest available in preflight and science only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/protocol036-correction-controls.yml')
          t=p.read_text(encoding='utf8')
          old="      - name: Download exact Protocol033 source for preflight fixture\n        if: env.STAGE == 'preflight'"
          new="      - name: Download exact Protocol033 source for preflight fixture and Stage-A manifest\n        if: env.STAGE == 'preflight' || env.STAGE == 'science'"
          assert old in t
          p.write_text(t.replace(old,new,1),encoding='utf8')
          PY
          python maintenance/validate_protocol036_plan.py

      - name: Commit final workflow correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/protocol036-correction-controls.yml
          git commit -m 'fix: make Protocol033 manifest available to Protocol036 science [skip ci]'
          git push origin HEAD:"$EXECUTION_REF"
