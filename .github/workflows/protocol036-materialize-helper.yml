name: Protocol036 deterministic repair runner

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  EXECUTION_REF: codex/protocol-036-correction-controls-20260930

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[p036-repair2]')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_REF }}
          fetch-depth: 0

      - name: Apply registered engineering repair
        run: python maintenance/repair_protocol036_preflight.py

      - name: Compile all Protocol036 sources
        run: |
          python -m py_compile protocol036_stream.py run_ftmoe_protocol036.py analyze_ftmoe_protocol036.py maintenance/repair_protocol036_preflight.py
          python -c "import hashlib,pathlib; p=pathlib.Path('artifacts/ftmoe_online/protocol_036/plan.json'); e=pathlib.Path('artifacts/ftmoe_online/protocol_036/plan.sha256').read_text().split()[0]; assert hashlib.sha256(p.read_bytes()).hexdigest()==e"

      - name: Commit repaired frozen implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run_ftmoe_protocol036.py analyze_ftmoe_protocol036.py maintenance/repair_protocol036_preflight.py
          git commit -m 'fix: Protocol036 deterministic preflight audit repair [skip ci]'
          git push origin HEAD:"$EXECUTION_REF"
