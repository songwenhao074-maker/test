name: Protocol042 inspect failed U once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol042-inspect-failed-u-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[p042r2-inspect-u]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da5eaa7e71f44497ede538c884e7ca688e6afbf4
      - name: Download immutable raw and inspect U gate only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11274660283/zip" -o /tmp/raw.zip
          echo "69190b023b4c0c2d9dfea3f2e5f84f0075f016298b047ed72a86395831d0a6b1  /tmp/raw.zip" | sha256sum -c -
          rm -rf /tmp/raw && mkdir /tmp/raw && unzip -q /tmp/raw.zip -d /tmp/raw
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('/tmp/raw')
          for name in ['protocol_status.json','budget_ledger.json','U_parent/status.json','U_parent/run_audit.json','U_parent/reproduction_report.json','U_parent/summary.json','U_parent/scientific_execution_complete.json']:
              p=root/name
              print('\n###',name,'exists=',p.exists())
              if p.exists():
                  print(p.read_text()[:30000])
          cps=list((root/'U_parent/checkpoints').glob('*.pt')) if (root/'U_parent/checkpoints').exists() else []
          print('\nCHECKPOINT_COUNT',len(cps))
          print('LATEST_EXISTS',(root/'U_parent/checkpoints/latest.pt').exists())
          print('OTHER_ARMS',[(a,(root/a).exists()) for a in ['R_win128','A_hist','A_win128']])
          PY
