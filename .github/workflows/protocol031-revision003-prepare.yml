name: Prepare Protocol-031 revision003 implementation

on:
  push:
    branches: [protocol-031-rare-recurrence-20260922]
    paths:
      - .github/workflows/protocol031-revision003-prepare.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare_revision003:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import authoritative revision003 directive
        env:
          REV3: 2511ff2c706fbcfea7bada332fe15d4094065f35
        run: |
          set -euo pipefail
          git fetch origin main || true
          git cat-file -e "$REV3^{commit}"
          files=(
            AGENTS.md
            NEXT_EXPERIMENT_LATEST.md
            PROJECT_CONTEXT_LATEST.md
            README.md
            artifacts/ftmoe_online/protocol_031/plan.json
            artifacts/ftmoe_online/protocol_031/scenario_registration.json
            artifacts/ftmoe_online/protocol_031/history/plan_revision_002.json
            artifacts/ftmoe_online/protocol_031/history/scenario_registration_revision_002.json
            docs/GITHUB_EXPERIMENT_HANDOFF.md
            docs/HISTORICAL_EXPERIMENTS.md
            docs/PROTOCOL030_ANALYSIS_20260922.md
            docs/PROTOCOL031_NONBLOCKING_REUSE_SPEC.md
            docs/PROTOCOL031_PLAN_REVISION_002_20260922.md
            docs/PROTOCOL031_PLAN_REVISION_003_20260926.md
            docs/PROTOCOL031_RARE_RECURRENCE_SCENARIO.md
            docs/PROTOCOL031_SINGLE_TASK_DIRECTIVE_20260922.md
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            git show "$REV3:$f" > "$f"
          done

      - name: Upgrade revision002 implementation to revision003 registration-driven code
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def rw(path, transforms):
              p=Path(path); s=p.read_text(encoding='utf8')
              for old,new in transforms:
                  if old not in s:
                      raise SystemExit(f'missing expected text in {path}: {old!r}')
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf8')

          # Method registration: same algorithms/budgets, new registered scenario identity.
          mp=Path('artifacts/ftmoe_online/protocol_031/method_registration.json')
          m=json.loads(mp.read_text())
          m['plan_revision']=3
          m['scenario_id']='protocol031_rare_recurrence_v2'
          m['data_revision']='protocol031_data_revision_002'
          mp.write_text(json.dumps(m,indent=2,allow_nan=False)+'\n')

          # Data utility: read lengths from registration; only revision/scenario identity is fixed.
          p=Path('prepare_ftmoe_protocol031_stream.py')
          s=p.read_text(encoding='utf8')
          s=s.replace('revision002','revision003')
          s=s.replace('SCENARIO_ID="protocol031_rare_recurrence_v1"','SCENARIO_ID="protocol031_rare_recurrence_v2"')
          s=s.replace('DATA_REVISION="protocol031_data_revision_001"','DATA_REVISION="protocol031_data_revision_002"\nPLAN_REVISION=3')
          s=s.replace('int(reg.get("plan_revision",-1))!=2','int(reg.get("plan_revision",-1))!=PLAN_REVISION')
          old='if int(reg.get("scored_intervals",-1))!=15468 or int(reg.get("guard_intervals",-1))!=1:\n        raise AssertionError("Protocol031 registered length mismatch")'
          new='steps=int(reg.get("scored_intervals",-1)); guard=int(reg.get("guard_intervals",-1))\n    total=int(reg.get("total_intervals",steps+guard))\n    if steps<=0 or guard!=1 or total!=steps+guard:\n        raise AssertionError("Protocol031 registered length mismatch")'
          if old not in s: raise SystemExit('prepare length guard not found')
          s=s.replace(old,new)
          s=s.replace('"protocol":"031","plan_revision":2,"scenario_id":SCENARIO_ID','"protocol":"031","plan_revision":PLAN_REVISION,"scenario_id":SCENARIO_ID')
          s=s.replace('"timeline_15468":audit["timeline_scored_intervals"]==15468','"timeline_matches_registration":audit["timeline_scored_intervals"]==steps')
          if '15468' in s or '15469' in s:
              raise SystemExit('old Protocol031 length hardcode remains in prepare module')
          p.write_text(s,encoding='utf8')

          # Collector already derives row count from registration; fix revision metadata only.
          p=Path('maintenance/run_protocol031_segment.py'); s=p.read_text(encoding='utf8')
          if '"plan_revision":2' not in s: raise SystemExit('collector revision marker not found')
          s=s.replace('"plan_revision":2','"plan_revision":P.PLAN_REVISION')
          p.write_text(s,encoding='utf8')

          # Independent verifier derives expected length from the same registration.
          p=Path('audit_ftmoe_protocol031.py'); s=p.read_text(encoding='utf8')
          s=s.replace('EXPECTED_STEPS=15468\nEXPECTED_ROWS=15469\nEXPECTED_HOSTS=16','EXPECTED_HOSTS=16')
          needle='    reg=P.registration()\n'
          insert='    reg=P.registration()\n    expected_steps=int(reg["scored_intervals"])\n    expected_rows=expected_steps+int(reg["guard_intervals"])\n'
          if needle not in s: raise SystemExit('audit registration load not found')
          s=s.replace(needle,insert,1)
          s=s.replace('EXPECTED_STEPS','expected_steps').replace('EXPECTED_ROWS','expected_rows')
          s=s.replace('"plan_revision":2','"plan_revision":P.PLAN_REVISION')
          s=s.replace('manifest.get("plan_revision")==2','manifest.get("plan_revision")==P.PLAN_REVISION')
          s=s.replace('"shape_15469x16"','"shape_registered_rows_x16"')
          if '15468' in s or '15469' in s:
              raise SystemExit('old Protocol031 length hardcode remains in audit')
          p.write_text(s,encoding='utf8')

          # Model runner: six windows stay registered; snapshot cursors derive from manifest.
          p=Path('run_ftmoe_protocol031_pilot.py'); s=p.read_text(encoding='utf8')
          s=s.replace('revision002','revision003')
          old='SNAPSHOT_POINTS={\n    1900:"after_U_first",\n    3500:"after_V_first",\n    6700:"before_U_rec1",\n    8428:"before_V_rec1",\n    10156:"before_U_rec2",\n    11884:"before_V_rec2",\n    13612:"before_U_rec3",\n    15340:"before_V_rec3",\n}'
          if old not in s: raise SystemExit('old snapshot block not found')
          s=s.replace(old,'SNAPSHOT_POINTS=None  # derived from frozen manifest timeline')
          needle='    pdefs=phases(manifest)\n    guard=build_guard(bundle)'
          repl='    pdefs=phases(manifest)\n    pmap={p["name"]:p for p in pdefs}\n    snapshot_points={\n        pmap["U_first"]["end"]:"after_U_first",\n        pmap["V_first"]["end"]:"after_V_first",\n        pmap["U_rec1"]["start"]:"before_U_rec1",\n        pmap["V_rec1"]["start"]:"before_V_rec1",\n        pmap["U_rec2"]["start"]:"before_U_rec2",\n        pmap["V_rec2"]["start"]:"before_V_rec2",\n        pmap["U_rec3"]["start"]:"before_U_rec3",\n        pmap["V_rec3"]["start"]:"before_V_rec3",\n    }\n    guard=build_guard(bundle)'
          if needle not in s: raise SystemExit('runner pdefs block not found')
          s=s.replace(needle,repl,1)
          s=s.replace('i in SNAPSHOT_POINTS','i in snapshot_points').replace('SNAPSHOT_POINTS[i]','snapshot_points[i]')
          s=s.replace('int(sreg.get("plan_revision",-1))!=2','int(sreg.get("plan_revision",-1))!=p31data.PLAN_REVISION')
          s=s.replace('"plan_revision":2','"plan_revision":p31data.PLAN_REVISION')
          p.write_text(s,encoding='utf8')

          # Finalizer/report identities.
          p=Path('finalize_ftmoe_protocol031.py'); s=p.read_text(encoding='utf8')
          s=s.replace('revision002','revision003').replace('revision002','revision003')
          s=s.replace('plan revision002','plan revision003')
          s=s.replace('"plan_revision": 2','"plan_revision": 3')
          s=s.replace('protocol031_rare_recurrence_v1','protocol031_rare_recurrence_v2')
          s=s.replace('protocol031_data_revision_001','protocol031_data_revision_002')
          p.write_text(s,encoding='utf8')

          # Small fixtures required before generation.
          p=Path('test_ftmoe_protocol031.py'); s=p.read_text(encoding='utf8')
          s=s.replace('test_revision002_registration_and_timeline','test_revision003_registration_and_timeline')
          s=s.replace('self.assertEqual(reg["plan_revision"],2)','self.assertEqual(reg["plan_revision"],3)')
          s=s.replace('self.assertEqual(reg["scored_intervals"],15468)','self.assertEqual(reg["scored_intervals"],9868)')
          s=s.replace('self.assertEqual(phases[-1]["end"],15468)','self.assertEqual(phases[-1]["end"],9868)')
          p.write_text(s,encoding='utf8')
          PY

      - name: Install final revision003 workflow without launching it yet
        run: |
          cat > .github/workflows/protocol031-rare-recurrence.yml <<'YAML'
          name: Protocol-031 revision003 rare-recurrence C/D pilot

          on:
            push:
              branches: [protocol-031-rare-recurrence-20260922]
              paths:
                - .github/workflows/protocol031-rare-recurrence.yml
            workflow_dispatch:
              inputs:
                stage:
                  description: 'Registered execution stage: generate or model'
                  type: choice
                  required: true
                  default: generate
                  options: [generate, model]
                resume_run_id:
                  description: 'Prior revision003 generation-state run ID'
                  type: string
                  required: false
                  default: ''
                frozen_run_id:
                  description: 'Revision003 run ID containing frozen data'
                  type: string
                  required: false
                  default: ''

          permissions:
            contents: write
            actions: write

          concurrency:
            group: protocol031-revision003-rare-recurrence
            cancel-in-progress: false

          jobs:
            protocol031:
              if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'launch Protocol031 revision003')
              runs-on: ubuntu-22.04
              timeout-minutes: 340
              env:
                OMP_NUM_THREADS: '1'
                MKL_NUM_THREADS: '1'
                OPENBLAS_NUM_THREADS: '1'
                PYTHONHASHSEED: '1'
                STAGE: ${{ github.event_name == 'push' && 'generate' || inputs.stage }}
                RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
                FROZEN_RUN_ID: ${{ inputs.frozen_run_id || '' }}
                DATA_ROOT: artifacts/ftmoe_online/protocol_031/data_revision_002
                RUN_ROOT: artifacts/ftmoe_online/protocol_031/runtime/revision003_run_${{ github.run_id }}
                SCENARIO_REG: artifacts/ftmoe_online/protocol_031/scenario_registration.json
                METHOD_REG: artifacts/ftmoe_online/protocol_031/method_registration.json
                FROZEN_BUNDLE: /tmp/protocol031_revision003_frozen
                GENERATION_SEGMENT: '1600'

              steps:
                - uses: actions/checkout@v4

                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.8'
                    cache: pip

                - name: Install frozen CPU dependencies
                  run: |
                    python -m pip install --upgrade pip
                    grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
                    python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
                    python -m pip install -r /tmp/requirements-online-ci.txt
                    python -m pip install dgl==1.1.3 dill==0.3.8 psutil

                - name: Compile revision003 implementation
                  run: |
                    python -m py_compile \
                      prepare_ftmoe_protocol031_stream.py \
                      maintenance/run_protocol031_segment.py \
                      audit_ftmoe_protocol031.py \
                      ftmoe_protocol031_nonblocking_reuse.py \
                      run_ftmoe_protocol031_pilot.py \
                      finalize_ftmoe_protocol031.py \
                      test_ftmoe_protocol031.py

                - name: Run revision003 preflight fixtures before first generation byte
                  if: env.STAGE == 'generate' && env.RESUME_RUN_ID == ''
                  run: |
                    python -m unittest -v \
                      test_ftmoe_protocol031.py \
                      test_ftmoe_protocol027_guard.py \
                      test_ftmoe_protocol028.py \
                      test_ftmoe_protocol025_model.py \
                      test_ftmoe_protocol025_session.py
                    python - <<'PY'
                    import json
                    reg=json.load(open('artifacts/ftmoe_online/protocol_031/scenario_registration.json'))
                    method=json.load(open('artifacts/ftmoe_online/protocol_031/method_registration.json'))
                    assert reg['protocol']=='031' and reg['plan_revision']==3
                    assert reg['scenario_id']=='protocol031_rare_recurrence_v2'
                    assert reg['data_revision']=='protocol031_data_revision_002'
                    assert reg['scored_intervals']==9868 and reg['guard_intervals']==1 and reg['total_intervals']==9869
                    assert [x['name'] for x in reg['timeline'] if '_rec' in x['name']]==['U_rec1','V_rec1','U_rec2','V_rec2','U_rec3','V_rec3']
                    assert reg['timeline'][-1]['end']==9868
                    assert method['plan_revision']==3 and method['arms']==['C_fixed5','D_nonblocking_reuse']
                    assert method['full_replay_budget']==2
                    print({'protocol031_revision003_preflight':True,'total_rows':9869,'six_recurrence_windows':True})
                    PY

                - name: Restore same revision003 generation state
                  if: env.STAGE == 'generate' && env.RESUME_RUN_ID != ''
                  uses: actions/download-artifact@v4
                  with:
                    name: protocol031-r3-generation-state-${{ inputs.resume_run_id }}
                    path: ${{ env.DATA_ROOT }}
                    github-token: ${{ github.token }}
                    repository: ${{ github.repository }}
                    run-id: ${{ inputs.resume_run_id }}

                - name: Record or verify revision003 pre-generation receipt
                  if: env.STAGE == 'generate'
                  run: |
                    mkdir -p "$DATA_ROOT" "$RUN_ROOT"
                    python - <<'PY'
                    import hashlib,json,os,pathlib
                    root=pathlib.Path(os.environ['DATA_ROOT'])
                    files=[
                      'artifacts/ftmoe_online/protocol_031/scenario_registration.json',
                      'artifacts/ftmoe_online/protocol_031/method_registration.json',
                      'prepare_ftmoe_protocol031_stream.py','maintenance/run_protocol031_segment.py',
                      'audit_ftmoe_protocol031.py','ftmoe_protocol031_nonblocking_reuse.py',
                      'run_ftmoe_protocol031_pilot.py','finalize_ftmoe_protocol031.py',
                      'simulator/workload/BitbrainWorkloadProtocol025.py',
                    ]
                    def sha(p):
                        h=hashlib.sha256(); h.update(pathlib.Path(p).read_bytes()); return h.hexdigest()
                    now={p:sha(p) for p in files}
                    reg=json.load(open(files[0]))
                    assert reg['plan_revision']==3 and reg['scenario_id']=='protocol031_rare_recurrence_v2'
                    assert reg['data_revision']=='protocol031_data_revision_002' and reg['total_intervals']==9869
                    p=root/'pre_generation_receipt.json'
                    if p.is_file():
                        old=json.load(open(p))
                        if old['file_sha256']!=now or old['registration_sha256']!=sha(files[0]):
                            raise SystemExit('Protocol031 revision003 scientific asset or registration hash changed during resume')
                        print({'receipt_verified':True,'implementation_commit':old['implementation_commit']})
                    else:
                        rec={'protocol':'031','plan_revision':3,'scenario_id':reg['scenario_id'],'data_revision':reg['data_revision'],
                             'registered_before_generation':True,'implementation_commit':reg['source_code_commit'],
                             'workflow_sha':os.environ['GITHUB_SHA'],'branch':os.environ['GITHUB_REF_NAME'],
                             'replay_seed':700,'model_seed':1,'registration_sha256':sha(files[0]),'file_sha256':now}
                        p.write_text(json.dumps(rec,indent=2)+'\n')
                        print({'receipt_created':True,'implementation_commit':rec['implementation_commit']})
                    PY

                - name: Advance only the same revision003 simulator stream
                  id: collect
                  if: env.STAGE == 'generate'
                  continue-on-error: true
                  run: |
                    rm -f "$DATA_ROOT/failure.json"
                    python maintenance/run_protocol031_segment.py --output "$DATA_ROOT" --max-intervals "$GENERATION_SEGMENT"

                - name: Inspect revision003 generation segment
                  id: gen
                  if: env.STAGE == 'generate'
                  run: |
                    python - <<'PY' >> "$GITHUB_OUTPUT"
                    import json,os,pathlib
                    root=pathlib.Path(os.environ['DATA_ROOT'])
                    failed=(os.environ.get('COLLECT_OUTCOME')!='success') or (root/'failure.json').is_file()
                    status=json.load(open(root/'generation_status.json')) if (root/'generation_status.json').is_file() else {}
                    complete=bool(status.get('complete')) and not failed
                    print('failed='+str(failed).lower())
                    print('complete='+str(complete).lower())
                    print('next_t='+str(status.get('next_t','unknown')))
                    PY
                  env:
                    COLLECT_OUTCOME: ${{ steps.collect.outcome }}

                - name: Archive resumable revision003 state
                  if: env.STAGE == 'generate'
                  uses: actions/upload-artifact@v4
                  with:
                    name: protocol031-r3-generation-state-${{ github.run_id }}
                    path: ${{ env.DATA_ROOT }}/
                    if-no-files-found: error
                    compression-level: 1
                    retention-days: 14

                - name: Dispatch next segment of the same revision003 stream
                  if: env.STAGE == 'generate' && steps.gen.outputs.failed == 'false' && steps.gen.outputs.complete == 'false'
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    gh api --method POST -H 'Accept: application/vnd.github+json' \
                      "/repos/$GITHUB_REPOSITORY/actions/workflows/protocol031-rare-recurrence.yml/dispatches" \
                      -f ref="$GITHUB_REF_NAME" -f 'inputs[stage]=generate' \
                      -f "inputs[resume_run_id]=$GITHUB_RUN_ID"
                    echo "Revision003 same-stream continuation dispatched from next_t=${{ steps.gen.outputs.next_t }}."

                - name: Independent model-free revision003 audit and hash freeze
                  id: audit
                  if: env.STAGE == 'generate' && steps.gen.outputs.failed == 'false' && steps.gen.outputs.complete == 'true'
                  continue-on-error: true
                  run: |
                    cp "$SCENARIO_REG" "$RUN_ROOT/scenario_registration_frozen.json"
                    python audit_ftmoe_protocol031.py --data-root "$DATA_ROOT" --output-root "$RUN_ROOT" \
                      --freeze-registration "$RUN_ROOT/scenario_registration_frozen.json"
                    cp "$DATA_ROOT/generation_status.json" "$RUN_ROOT/generation_status.json"
                    cp "$DATA_ROOT/pre_generation_receipt.json" "$RUN_ROOT/pre_generation_receipt.json"

                - name: Assemble immutable revision003 frozen-data bundle
                  if: env.STAGE == 'generate' && steps.gen.outputs.complete == 'true' && steps.audit.outcome == 'success'
                  run: |
                    rm -rf "$FROZEN_BUNDLE"
                    mkdir -p "$FROZEN_BUNDLE/data" "$FROZEN_BUNDLE/evidence"
                    cp -a "$DATA_ROOT/." "$FROZEN_BUNDLE/data/"
                    cp "$RUN_ROOT/eligibility.json" "$FROZEN_BUNDLE/evidence/eligibility.json"
                    cp "$RUN_ROOT/data_lock.json" "$FROZEN_BUNDLE/evidence/data_lock.json"
                    cp "$RUN_ROOT/scenario_registration_frozen.json" "$FROZEN_BUNDLE/evidence/scenario_registration_frozen.json"
                    cp "$RUN_ROOT/generation_status.json" "$FROZEN_BUNDLE/evidence/generation_status.json"
                    cp "$RUN_ROOT/pre_generation_receipt.json" "$FROZEN_BUNDLE/evidence/pre_generation_receipt.json"
                    cp "$METHOD_REG" "$FROZEN_BUNDLE/evidence/method_registration.json"

                - name: Upload frozen revision003 data before either comparator starts
                  if: env.STAGE == 'generate' && steps.gen.outputs.complete == 'true' && steps.audit.outcome == 'success'
                  id: frozen
                  uses: actions/upload-artifact@v4
                  with:
                    name: protocol031-r3-frozen-data-${{ github.run_id }}
                    path: ${{ env.FROZEN_BUNDLE }}/
                    if-no-files-found: error
                    compression-level: 1
                    retention-days: 90

                - name: Dispatch the single same-job C/D model replay pair
                  if: env.STAGE == 'generate' && steps.gen.outputs.complete == 'true' && steps.audit.outcome == 'success'
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    gh api --method POST -H 'Accept: application/vnd.github+json' \
                      "/repos/$GITHUB_REPOSITORY/actions/workflows/protocol031-rare-recurrence.yml/dispatches" \
                      -f ref="$GITHUB_REF_NAME" -f 'inputs[stage]=model' \
                      -f "inputs[frozen_run_id]=$GITHUB_RUN_ID"

                - name: Materialize terminal revision003 generation blocker
                  if: env.STAGE == 'generate' && (steps.gen.outputs.failed == 'true' || (steps.gen.outputs.complete == 'true' && steps.audit.outcome == 'failure'))
                  run: |
                    mkdir -p "$RUN_ROOT"
                    cp "$DATA_ROOT/generation_status.json" "$RUN_ROOT/generation_status.json" 2>/dev/null || true
                    cp "$DATA_ROOT/pre_generation_receipt.json" "$RUN_ROOT/pre_generation_receipt.json" 2>/dev/null || true
                    cp "$DATA_ROOT/failure.json" "$RUN_ROOT/generation_failure.json" 2>/dev/null || true
                    python - <<'PY'
                    import json,os,pathlib
                    root=pathlib.Path(os.environ['RUN_ROOT'])
                    blocker='generation_segment_failed' if '${{ steps.gen.outputs.failed }}'=='true' else 'model_free_data_audit_failed'
                    status={'protocol':'031','plan_revision':3,'scenario_id':'protocol031_rare_recurrence_v2',
                            'data_revision':'protocol031_data_revision_002','run_id':os.environ['GITHUB_RUN_ID'],
                            'completed':False,'full_model_replays_started':0,'full_model_replay_budget':2,
                            'completed_comparators':[],'failed_comparators':[],'A_B_runs':0,
                            'automatic_followups_started':[],'blocker':blocker,'no_reroll':True}
                    (root/'status.json').write_text(json.dumps(status,indent=2)+'\n')
                    PY

                - name: Restore frozen revision003 bundle for same-job C/D
                  if: env.STAGE == 'model'
                  uses: actions/download-artifact@v4
                  with:
                    name: protocol031-r3-frozen-data-${{ inputs.frozen_run_id }}
                    path: ${{ env.FROZEN_BUNDLE }}
                    github-token: ${{ github.token }}
                    repository: ${{ github.repository }}
                    run-id: ${{ inputs.frozen_run_id }}

                - name: Verify revision003 frozen bundle before model replays
                  if: env.STAGE == 'model'
                  run: |
                    mkdir -p "$RUN_ROOT"
                    python - <<'PY'
                    import json,os,pathlib,hashlib
                    b=pathlib.Path(os.environ['FROZEN_BUNDLE'])
                    lock=json.load(open(b/'evidence/data_lock.json'))
                    reg=json.load(open(b/'evidence/scenario_registration_frozen.json'))
                    method=json.load(open(b/'evidence/method_registration.json'))
                    h=hashlib.sha256((b/'data/stream.npz').read_bytes()).hexdigest()
                    assert lock['locked'] is True and lock['model_free_eligibility_passed'] is True
                    assert lock['plan_revision']==3 and reg['plan_revision']==3 and method['plan_revision']==3
                    assert reg['scenario_id']=='protocol031_rare_recurrence_v2' and reg['data_revision']=='protocol031_data_revision_002'
                    assert h==lock['stream_sha256']==reg['generation']['expected_stream_sha256']
                    assert reg['generation']['frozen_before_model_runs'] is True
                    print({'revision003_frozen_bundle_verified':True,'stream_sha256':h})
                    PY
                    cp "$FROZEN_BUNDLE/evidence/eligibility.json" "$RUN_ROOT/eligibility.json"
                    cp "$FROZEN_BUNDLE/evidence/data_lock.json" "$RUN_ROOT/data_lock.json"
                    cp "$FROZEN_BUNDLE/evidence/scenario_registration_frozen.json" "$RUN_ROOT/scenario_registration_frozen.json"
                    cp "$FROZEN_BUNDLE/evidence/generation_status.json" "$RUN_ROOT/generation_status.json"
                    cp "$FROZEN_BUNDLE/evidence/pre_generation_receipt.json" "$RUN_ROOT/pre_generation_receipt.json"

                - name: Run exactly one C_fixed5 then one D_nonblocking_reuse in this same job
                  id: model_pair
                  if: env.STAGE == 'model'
                  continue-on-error: true
                  run: |
                    python run_ftmoe_protocol031_pilot.py \
                      --stream "$FROZEN_BUNDLE/data" \
                      --out-root "$RUN_ROOT" \
                      --scenario-registration "$FROZEN_BUNDLE/evidence/scenario_registration_frozen.json" \
                      --method-registration "$FROZEN_BUNDLE/evidence/method_registration.json" \
                      --data-lock "$FROZEN_BUNDLE/evidence/data_lock.json" \
                      --eligibility "$FROZEN_BUNDLE/evidence/eligibility.json" \
                      --run-id "$GITHUB_RUN_ID" \
                      > "$RUN_ROOT/model_pair.stdout.log" 2> "$RUN_ROOT/model_pair.stderr.log"

                - name: Record deterministic execution environment
                  if: env.STAGE == 'model'
                  run: |
                    python -m pip freeze > "$RUN_ROOT/pip_freeze.txt"
                    python - <<'PY'
                    import json,os,pathlib,platform,torch
                    root=pathlib.Path(os.environ['RUN_ROOT'])
                    (root/'environment.json').write_text(json.dumps({
                      'python':platform.python_version(),'platform':platform.platform(),'torch':torch.__version__,
                      'OMP_NUM_THREADS':os.environ.get('OMP_NUM_THREADS'),'MKL_NUM_THREADS':os.environ.get('MKL_NUM_THREADS'),
                      'OPENBLAS_NUM_THREADS':os.environ.get('OPENBLAS_NUM_THREADS'),'PYTHONHASHSEED':os.environ.get('PYTHONHASHSEED')},indent=2)+'\n')
                    (root/'workflow_execution.json').write_text(json.dumps({
                      'protocol':'031','plan_revision':3,'terminal_run_id':os.environ['GITHUB_RUN_ID'],
                      'branch':os.environ['GITHUB_REF_NAME'],'head_sha':os.environ['GITHUB_SHA'],
                      'frozen_run_id':os.environ.get('FROZEN_RUN_ID'),'full_generation_budget':1,
                      'full_model_replay_budget':2,'A_B_runs':0,'automatic_scientific_followups':0,
                      'same_model_job_sequential_independent_processes':True},indent=2)+'\n')
                    PY

                - name: Upload terminal revision003 evidence
                  if: env.STAGE == 'model' || (env.STAGE == 'generate' && (steps.gen.outputs.failed == 'true' || (steps.gen.outputs.complete == 'true' && steps.audit.outcome == 'failure')))
                  id: terminal
                  uses: actions/upload-artifact@v4
                  with:
                    name: protocol031-revision003-${{ github.run_id }}
                    path: ${{ env.RUN_ROOT }}/
                    if-no-files-found: warn
                    compression-level: 3
                    retention-days: 90

                - name: Build final report and compact Git handoff
                  if: env.STAGE == 'model' || (env.STAGE == 'generate' && (steps.gen.outputs.failed == 'true' || (steps.gen.outputs.complete == 'true' && steps.audit.outcome == 'failure')))
                  env:
                    ARTIFACT_ID: ${{ steps.terminal.outputs.artifact-id }}
                    ARTIFACT_URL: ${{ steps.terminal.outputs.artifact-url }}
                    ARTIFACT_DIGEST: ${{ steps.terminal.outputs.artifact-digest }}
                  run: |
                    python finalize_ftmoe_protocol031.py \
                      --run-root "$RUN_ROOT" \
                      --git-dest "artifacts/ftmoe_online/protocol_031/revision003_runs/run_$GITHUB_RUN_ID" \
                      --run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" \
                      --artifact-id "$ARTIFACT_ID" --artifact-url "$ARTIFACT_URL" --artifact-digest "$ARTIFACT_DIGEST"

                - name: Commit compact terminal results and handoff
                  if: env.STAGE == 'model' || (env.STAGE == 'generate' && (steps.gen.outputs.failed == 'true' || (steps.gen.outputs.complete == 'true' && steps.audit.outcome == 'failure')))
                  run: |
                    git config user.name github-actions[bot]
                    git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                    git add README.md AGENTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md \
                      docs/PROTOCOL031_RESULTS.md docs/GITHUB_EXPERIMENT_HANDOFF.md \
                      artifacts/ftmoe_online/protocol_031/revision003_runs/
                    git commit -m "results: Protocol031 revision003 terminal evidence [skip ci]" || exit 0
                    git push origin HEAD:$GITHUB_REF_NAME
          YAML

      - name: Commit revision003 implementation without starting the target workflow
        id: impl
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AGENTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md README.md \
            artifacts/ftmoe_online/protocol_031/plan.json \
            artifacts/ftmoe_online/protocol_031/scenario_registration.json \
            artifacts/ftmoe_online/protocol_031/method_registration.json \
            artifacts/ftmoe_online/protocol_031/history/ \
            docs/GITHUB_EXPERIMENT_HANDOFF.md docs/HISTORICAL_EXPERIMENTS.md \
            docs/PROTOCOL030_ANALYSIS_20260922.md docs/PROTOCOL031_NONBLOCKING_REUSE_SPEC.md \
            docs/PROTOCOL031_PLAN_REVISION_002_20260922.md docs/PROTOCOL031_PLAN_REVISION_003_20260926.md \
            docs/PROTOCOL031_RARE_RECURRENCE_SCENARIO.md docs/PROTOCOL031_SINGLE_TASK_DIRECTIVE_20260922.md \
            prepare_ftmoe_protocol031_stream.py maintenance/run_protocol031_segment.py \
            audit_ftmoe_protocol031.py run_ftmoe_protocol031_pilot.py finalize_ftmoe_protocol031.py \
            test_ftmoe_protocol031.py .github/workflows/protocol031-rare-recurrence.yml
          git commit -m "exp: implement Protocol031 revision003 registered 9869-step stream [skip ci]"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:$GITHUB_REF_NAME

      - name: Register final implementation commit before generation
        id: freeze
        env:
          IMPLEMENTATION_SHA: ${{ steps.impl.outputs.sha }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          sha=os.environ['IMPLEMENTATION_SHA']
          for name,key in [
              ('artifacts/ftmoe_online/protocol_031/scenario_registration.json','source_code_commit'),
              ('artifacts/ftmoe_online/protocol_031/plan.json','source_commit')]:
              p=pathlib.Path(name); x=json.load(open(p)); x[key]=sha
              p.write_text(json.dumps(x,indent=2,allow_nan=False)+'\n')
          PY
          git add artifacts/ftmoe_online/protocol_031/scenario_registration.json artifacts/ftmoe_online/protocol_031/plan.json
          git commit -m "exp: freeze Protocol031 revision003 implementation identity [skip ci]"
          git push origin HEAD:$GITHUB_REF_NAME
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Launch exactly the registered revision003 generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/protocol031-rare-recurrence.yml/dispatches" \
            -f ref="$GITHUB_REF_NAME" -f 'inputs[stage]=generate'
          echo "Protocol031 revision003 generation dispatched from fresh data_revision_002 root."
