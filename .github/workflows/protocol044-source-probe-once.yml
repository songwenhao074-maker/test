name: Protocol044 source probe once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol044-source-probe-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[p044-source-probe]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/protocol-044-closeout-capacity-20261004
          fetch-depth: 0
      - name: Download registered frozen inputs
        run: |
          set -euo pipefail
          rm -rf /tmp/p044 && mkdir -p /tmp/p044/a35 /tmp/p044/a33 /tmp/p044/evidence
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11041705829/zip" -o /tmp/p044/a35.zip
          echo "849a8367727e00833a3ae92fda873a3989121d2f7ee207e66f9789357d538421  /tmp/p044/a35.zip" | sha256sum -c -
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10968752245/zip" -o /tmp/p044/a33.zip
          echo "d92a3f9c8f1ebd292b86fbbe6e2300291135376f3564f2773975fd9203b55944  /tmp/p044/a33.zip" | sha256sum -c -
          unzip -q /tmp/p044/a35.zip -d /tmp/p044/a35
          unzip -q /tmp/p044/a33.zip -d /tmp/p044/a33
      - name: Resolve all pre-generation source checkpoints
        run: |
          set -euo pipefail
          python maintenance/protocol044_source_probe.py --repo . --artifact035 /tmp/p044/a35 --artifact033 /tmp/p044/a33 --out /tmp/p044/evidence/source_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol044-source-probe-${{ github.run_id }}
          path: /tmp/p044/evidence
          retention-days: 90
          if-no-files-found: error
