name: Protocol042 repair U boundary once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol042-repair-u-boundary-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  repair:
    if: contains(github.event.head_commit.message, '[p042r2-repair-u-boundary]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da5eaa7e71f44497ede538c884e7ca688e6afbf4
      - name: Build no-retraining U boundary repair from immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11274660283/zip" -o /tmp/raw.zip
          echo "69190b023b4c0c2d9dfea3f2e5f84f0075f016298b047ed72a86395831d0a6b1  /tmp/raw.zip" | sha256sum -c -
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11275429812/zip" -o /tmp/audit.zip
          echo "d90c65c1bd609bd759215e95550ee410938479f4a580e1916d211ed8e2434105  /tmp/audit.zip" | sha256sum -c -
          rm -rf /tmp/repaired /tmp/audit && mkdir -p /tmp/repaired /tmp/audit
          unzip -q /tmp/raw.zip -d /tmp/repaired
          unzip -q /tmp/audit.zip -d /tmp/audit
          python - <<'PY'
          import json, pathlib, shutil, hashlib
          root=pathlib.Path('/tmp/repaired'); u=root/'U_parent'
          audit=json.load(open('/tmp/audit/u_tolerance_report.json'))
          assert audit['all_pass'] is True
          assert audit['tolerance']==1e-12
          assert audit['structural_mismatch_count']==0
          assert audit['numeric_over_tolerance_count']==0
          assert audit['max_abs_diff']<=1e-12
          assert audit['prediction_arrays_exact'] is True
          assert audit['counts_hashes_qualification_exact'] is True
          assert audit['science_reexecuted'] is False
          orig=json.load(open(u/'reproduction_report.json'))
          assert orig['all_pass'] is False
          assert all(orig['prediction_arrays'].values())
          assert orig['expected_counts'] is True
          assert orig['final_model_optimizer_hash_exact'] is True
          assert orig['qualification_arrays_exact'] is True
          assert orig['qualification_metric_exact'] is True
          assert orig['full_AP_absolute_difference']==0.0
          ua=json.load(open(u/'run_audit.json')); assert ua['all_pass'] is True
          sm=json.load(open(u/'summary.json'))
          assert sm['terminal_progress']==3 and sm['next_substep']=='done'
          assert sm['live_optimizer_steps']==295 and sm['shadow_optimizer_steps']==16
          assert sm['first_birth_t']==351
          led=json.load(open(root/'budget_ledger.json'))
          assert led['sequences']['U_parent']['started'] is True
          assert led['sequences']['U_parent']['completed'] is False
          assert all(led['sequences'][x]['started'] is False for x in ['R_win128','A_hist','A_win128'])
          # Preserve every original gate-failure record before changing boundary state.
          for src,dst in [
            (u/'reproduction_report.json',u/'reproduction_report_gate_failure_original.json'),
            (u/'status.json',u/'status_gate_failure_original.json'),
            (root/'budget_ledger.json',root/'budget_ledger_gate_failure_original.json'),
            (root/'protocol_status.json',root/'protocol_status_gate_failure_original.json'),
            (root/'scientific_raw_manifest.json',root/'scientific_raw_manifest_gate_failure_original.json')]:
              if src.exists(): shutil.copy2(src,dst)
          shutil.copy2('/tmp/audit/u_tolerance_report.json',u/'reproduction_tolerance_audit.json')
          recovered=dict(orig)
          recovered.update({
            'all_pass':True,
            'gate_recovery':'preregistered_float_tolerance_1e-12',
            'original_gate_all_pass':False,
            'structural_mismatch_count':0,
            'numeric_over_tolerance_count':0,
            'max_abs_discrete_numeric_difference':audit['max_abs_diff'],
            'all_nonfloat_discrete_structure_exact':True,
            'science_reexecuted':False,
            'recovery_audit_artifact_id':11275429812,
            'recovery_audit_artifact_digest':'sha256:d90c65c1bd609bd759215e95550ee410938479f4a580e1916d211ed8e2434105',
            'original_raw_artifact_id':11274660283,
            'original_raw_artifact_digest':'sha256:69190b023b4c0c2d9dfea3f2e5f84f0075f016298b047ed72a86395831d0a6b1'
          })
          (u/'reproduction_report.json').write_text(json.dumps(recovered,indent=2)+'\n')
          status=json.load(open(u/'status.json'))
          status.update({'science_status':'completed','analysis_status':'pending','publication_status':'pending',
                         'recovered_gate_only':True,'science_reexecuted':False,
                         'original_failure_preserved':'status_gate_failure_original.json'})
          (u/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          (u/'scientific_execution_complete.json').write_text(json.dumps({
            'protocol':'042','revision':2,'arm':'U_parent','complete':True,'audit_all_pass':True,
            'reproduction_all_pass':True,'science_reexecuted':False,
            'boundary_recovered_from_raw_artifact':11274660283},indent=2)+'\n')
          led['sequences']['U_parent'].update({
            'completed':True,'live_optimizer_steps':295,'shadow_optimizer_steps':16,
            'completed_via_boundary_recovery':True,'science_reexecuted':False,
            'source_raw_artifact_id':11274660283
          })
          led['total_optimizer_steps']=311
          led['gate_recovery']={
            'kind':'U_reproduction_float_comparator',
            'tolerance':1e-12,'max_abs_diff':audit['max_abs_diff'],
            'structural_mismatch_count':0,'science_reexecuted':False,
            'audit_artifact_id':11275429812
          }
          (root/'budget_ledger.json').write_text(json.dumps(led,indent=2)+'\n')
          ps=json.load(open(root/'protocol_status.json'))
          ps.update({'science_status':'resume_boundary_ready','analysis_status':'not_started',
                     'publication_status':'pending','science_rc':0,'restart_from_zero':False,
                     'science_reexecuted':False,'next_arm':'R_win128',
                     'U_boundary_recovered_from_raw_artifact':11274660283})
          (root/'protocol_status.json').write_text(json.dumps(ps,indent=2)+'\n')
          # Remove stale manifest from active name; formal resume will reseal after R/A.
          p=root/'scientific_raw_manifest.json'
          if p.exists(): p.unlink()
          # Write an explicit recovery index.
          files={}
          for p in sorted(root.rglob('*')):
            if p.is_file():
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              files[p.relative_to(root).as_posix()]={'sha256':h,'size':p.stat().st_size}
          (root/'U_boundary_recovery_index.json').write_text(json.dumps({
            'protocol':'042','revision':2,'source_raw_artifact_id':11274660283,
            'source_raw_digest':'sha256:69190b023b4c0c2d9dfea3f2e5f84f0075f016298b047ed72a86395831d0a6b1',
            'audit_artifact_id':11275429812,
            'audit_digest':'sha256:d90c65c1bd609bd759215e95550ee410938479f4a580e1916d211ed8e2434105',
            'next_arm':'R_win128','science_reexecuted':False,
            'files_after_repair':len(files)
          },indent=2)+'\n')
          print(json.dumps({'repaired':True,'next_arm':'R_win128','U_steps':311,'science_reexecuted':False,
                            'max_abs_diff':audit['max_abs_diff']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: protocol042-raw-repaired-u-${{ github.run_id }}
          path: /tmp/repaired
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
