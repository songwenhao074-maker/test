name: Protocol-024 next-round response-law generation

# Generation-only workflow. Downstream learnability/budget/A-C-D evaluation is
# intentionally split into protocol024-next-round-valid.yml so the expensive
# 4981-row simulator run is not repeated when evaluation code changes.
on:
  workflow_dispatch:
  push:
    branches: [protocol-024-next-round-gpt56]
    paths:
      - 'maintenance/run_protocol024_stream_collect.py'
      - 'artifacts/ftmoe_online/protocol_024/next_round_v1/execution_environment.json'
      - '.github/workflows/protocol024-next-round-pilot.yml'

permissions:
  contents: read

jobs:
  generation-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      ROOT_OUT: artifacts/ftmoe_online/protocol_024/next_round_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install online dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3
      - name: Verify registered generator and hosted guard
        run: |
          python -m unittest -v test_ftmoe_protocol024_response_laws.py
          python -m py_compile maintenance/run_protocol024_stream_collect.py prepare_ftmoe_protocol024_stream.py
          python - <<'PY'
          import json
          p=json.load(open('artifacts/ftmoe_online/protocol_024/next_round_v1/execution_environment.json'))
          assert p['available_ram_guard_gib']==0.5
          assert p['available_disk_guard_gib']==5.0
          assert p['generation_timeout_minutes']==300
          assert p['scientific_parameters_changed'] is False
          assert p['response_law_config_changed'] is False
          assert p['confirmation_seeds_used'] is False
          print(json.dumps({'ram_guard_gib':0.5,'disk_guard_gib':5.0,'timeout_minutes':300,'scientific_parameters_changed':False}))
          PY
      - name: Generate registered seed700 response-law stream
        run: |
          python maintenance/run_protocol024_stream_collect.py --output "$ROOT_OUT/data"
      - name: Audit finalized stream before upload
        run: |
          python - <<'PY'
          import hashlib, json, numpy as np
          from pathlib import Path
          root=Path('artifacts/ftmoe_online/protocol_024/next_round_v1/data')
          m=json.loads((root/'manifest.json').read_text())
          assert m['protocol']=='024' and m['steps']==4980 and m['guard_rows']==1 and m['seed']==700
          h=hashlib.sha256()
          with (root/'stream.npz').open('rb') as f:
              for b in iter(lambda:f.read(4*1024*1024),b''): h.update(b)
          assert h.hexdigest()==m['stream_sha256']
          with np.load(root/'stream.npz') as d:
              ratio=d['overload_ratio']
              expected=np.where((ratio>1.0).any(-1),ratio.argmax(-1)+1,0)
              assert np.array_equal(expected,d['raw_labels'])
              assert d['raw_labels'].shape==(4981,16)
              assert not set(m['audit_only_npz_keys']) & set(m['model_input_keys'])
          print(json.dumps({'stream_sha256':m['stream_sha256'],'steps':4980,'guard_rows':1,'label_recompute_equal':True}))
          PY
      - name: Upload generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol024-next-round-v1-generation-only
          path: artifacts/ftmoe_online/protocol_024/next_round_v1/data
          if-no-files-found: warn
          compression-level: 6
