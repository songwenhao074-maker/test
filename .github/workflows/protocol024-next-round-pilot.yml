name: Protocol-024 next-round response-law pilot

on:
  workflow_dispatch:
  push:
    branches: [protocol-024-next-round-gpt56]
    paths:
      - 'simulator/workload/BitbrainWorkloadProtocol024.py'
      - 'prepare_ftmoe_protocol024_stream.py'
      - 'probe_ftmoe_protocol024_learnability.py'
      - 'run_ftmoe_protocol024_budget.py'
      - 'run_ftmoe_protocol024_pilot.py'
      - 'test_ftmoe_protocol024_response_laws.py'
      - 'artifacts/ftmoe_online/protocol_024/next_round_v1/response_law_config.json'
      - 'artifacts/ftmoe_online/protocol_024/next_round_v1/lifecycle_config.json'
      - 'artifacts/ftmoe_online/protocol_024/next_round_v1/budget_policy.json'
      - '.github/workflows/protocol024-next-round-pilot.yml'

permissions:
  contents: read

jobs:
  development-pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      ROOT_OUT: artifacts/ftmoe_online/protocol_024/next_round_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install online dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3
      - name: Verify frozen response-law registration
        run: |
          python -m unittest -v test_ftmoe_protocol024_response_laws.py
          python -m py_compile prepare_ftmoe_protocol024_stream.py probe_ftmoe_protocol024_learnability.py run_ftmoe_protocol024_budget.py run_ftmoe_protocol024_pilot.py
      - name: Generate registered seed700 response-law stream
        run: |
          python prepare_ftmoe_protocol024_stream.py --output "$ROOT_OUT/data"
      - name: Audit stream labels and input separation
        run: |
          python - <<'PY'
          import json, numpy as np
          from pathlib import Path
          root=Path('artifacts/ftmoe_online/protocol_024/next_round_v1/data')
          m=json.loads((root/'manifest.json').read_text())
          assert m['protocol']=='024' and m['steps']==4980 and m['guard_rows']==1
          with np.load(root/'stream.npz') as d:
              assert d['raw_labels'].shape==(4981,16)
              ratio=d['overload_ratio']
              expected=np.where((ratio>1.0).any(-1), ratio.argmax(-1)+1, 0)
              assert np.array_equal(expected, d['raw_labels'])
              for key in m['model_input_keys']:
                  assert key in d.files
              assert not set(m['audit_only_npz_keys']) & set(m['model_input_keys'])
              for key in ('host_features','demands','schedules','capacities'):
                  assert np.isfinite(d[key]).all()
          print(json.dumps({'stream_label_recompute_equal':True,
                            'audit_ids_excluded_from_model_input_keys':True,
                            'steps':4980}))
          PY
      - name: Run raw-history and frozen-z learnability probe
        run: |
          python probe_ftmoe_protocol024_learnability.py \
            --stream "$ROOT_OUT/data" \
            --out "$ROOT_OUT/probes/learnability.json"
      - name: Enforce preregistered learnability gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/ftmoe_online/protocol_024/next_round_v1/probes/learnability.json'))
          print(json.dumps({'raw_history_learnable':p['raw_history_learnable'],
                            'z_retains_history_signal':p['z_retains_history_signal'],
                            'proceed':p['proceed_to_budget_and_pilot']}))
          if not p['raw_history_learnable']:
              raise SystemExit('RAW_HISTORY_UNLEARNABLE: stop before model budget/pilot; only one registered response-law revision is allowed')
          if not p['z_retains_history_signal']:
              raise SystemExit('FROZEN_Z_LOSES_HISTORY_SIGNAL: stop and register one common temporal feature for C and D before rerunning equivalence')
          PY
      - name: Run bounded fixed-C budget comparison
        run: |
          python run_ftmoe_protocol024_budget.py \
            --stream "$ROOT_OUT/data" \
            --out "$ROOT_OUT/budget/comparison.json"
      - name: Run lifecycle-on A C D development pilot
        run: |
          python run_ftmoe_protocol024_pilot.py \
            --stream "$ROOT_OUT/data" \
            --budget "$ROOT_OUT/budget/comparison.json" \
            --lifecycle "$ROOT_OUT/lifecycle_config.json" \
            --out-root "$ROOT_OUT/runs/seed700_rawnext_lifecycle_v1" \
            --comparison "$ROOT_OUT/comparison.json"
      - name: Write machine-readable status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/ftmoe_online/protocol_024/next_round_v1')
          def read(rel):
              p=root/rel
              return json.loads(p.read_text()) if p.is_file() else None
          learn=read('probes/learnability.json')
          budget=read('budget/comparison.json')
          comp=read('comparison.json')
          status={
            'protocol':'024','round':'next_round_v1','confirmation_run':False,
            'engineering_passed':True,
            'new_stream_generated':(root/'data/manifest.json').is_file(),
            'learnability_completed':learn is not None,
            'learnability_passed':None if learn is None else bool(learn.get('proceed_to_budget_and_pilot')),
            'budget_comparison_completed':budget is not None,
            'lifecycle_on_run_completed':comp is not None,
            'lifecycle_exercised':None if comp is None else bool(comp.get('lifecycle',{}).get('lifecycle_exercised')),
            'development_signal':None if comp is None else comp.get('development_signal'),
            'selected_update_every':None if budget is None else budget.get('selected_update_every'),
            'response_law_config_id':'response_law_v1',
            'target':'raw_next_fault',
            'seeds':{'replay':700,'model':1,'confirmation_used':[]},
          }
          if comp is not None and not status['lifecycle_exercised']:
              status['lifecycle_not_exercised_reason']=comp.get('lifecycle',{}).get('lifecycle_not_exercised_reason')
          (root/'status.json').write_text(json.dumps(status,indent=2,allow_nan=False)+'\n')
          print(json.dumps(status,indent=2,allow_nan=False))
          PY
      - name: Upload complete Protocol-024 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol024-next-round-v1-development
          path: |
            artifacts/ftmoe_online/protocol_024/next_round_v1/data
            artifacts/ftmoe_online/protocol_024/next_round_v1/probes
            artifacts/ftmoe_online/protocol_024/next_round_v1/budget
            artifacts/ftmoe_online/protocol_024/next_round_v1/runs
            artifacts/ftmoe_online/protocol_024/next_round_v1/comparison.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/status.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/registration.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/response_law_config.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/lifecycle_config.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/budget_policy.json
          if-no-files-found: warn
          compression-level: 6
