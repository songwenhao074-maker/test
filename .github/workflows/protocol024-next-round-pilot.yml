name: Protocol-024 next-round response-law generation (superseded downstream)

# Kept for reproducibility. Push-triggered execution is disabled after the
# immutable response_law_v1 seed700 stream was generated by run 34839589954.
# Its downstream probe/anchor path was superseded before any valid performance
# result because it lacked the directive-required 13-interval probe gap and
# reused old tol1 anchor labels. The corrected workflow reuses only its data/.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generation-and-superseded-development:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      ROOT_OUT: artifacts/ftmoe_online/protocol_024/next_round_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install online dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3
      - name: Generate registered seed700 response-law stream
        run: |
          python maintenance/run_protocol024_stream_collect.py --output "$ROOT_OUT/data"
      - name: Upload generated stream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol024-next-round-v1-generation-only
          path: artifacts/ftmoe_online/protocol_024/next_round_v1/data
          if-no-files-found: warn
          compression-level: 6
