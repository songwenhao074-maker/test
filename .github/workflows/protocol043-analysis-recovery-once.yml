name: Protocol043 analysis recovery once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol043-analysis-recovery-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  recover:
    if: contains(github.event.head_commit.message, '[p043-analysis-recovery]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      SCIENCE_RUN_ID: "37168746303"
      RAW_ARTIFACT_ID: "11290523632"
      RAW_DIGEST: "6387aa37df285bf8b1842b5f1e57250a55cb3bff6004e9d4cd3b57ccde5877b3"
      ORIGINAL_COMPACT_ARTIFACT_ID: "11290339056"
      ORIGINAL_COMPACT_DIGEST: "5b4c2f52548435d6f18ed777a0d415d0d84e398852e07135e039efe76e9fbc1e"
      FROZEN_SHA: "9d9320cf84ebaf034dca9e8257f0dc82171cc916"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "1"

    steps:
      - name: Checkout recovery tool
        uses: actions/checkout@v4
        with:
          ref: main
          path: recovery_tool
          fetch-depth: 1

      - name: Checkout exact frozen Protocol043 science code
        uses: actions/checkout@v4
        with:
          ref: 9d9320cf84ebaf034dca9e8257f0dc82171cc916
          path: frozen
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.18"

      - name: Install fixed analysis dependencies and verify frozen SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen rev-parse HEAD)" = "$FROZEN_SHA"
          python frozen/maintenance/validate_protocol043_plan.py
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          python -m pip install numpy==1.24.4 psutil==5.9.8

      - name: Download and validate sealed raw and original compact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p043raw /tmp/p043orig /tmp/p043analysis
          mkdir -p /tmp/p043raw /tmp/p043orig /tmp/p043analysis
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$RAW_ARTIFACT_ID/zip" -o /tmp/p043raw.zip
          echo "$RAW_DIGEST  /tmp/p043raw.zip" | sha256sum -c -
          unzip -q /tmp/p043raw.zip -d /tmp/p043raw
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ORIGINAL_COMPACT_ARTIFACT_ID/zip" -o /tmp/p043orig.zip
          echo "$ORIGINAL_COMPACT_DIGEST  /tmp/p043orig.zip" | sha256sum -c -
          unzip -q /tmp/p043orig.zip -d /tmp/p043orig
          test -f /tmp/p043orig/analysis/analysis_status.json
          test "$(python -c 'import json; print(json.load(open("/tmp/p043orig/analysis/analysis_status.json"))["system_result_label"])')" = "invalid_execution"

      - name: Recompute analysis from sealed raw with NaN-aware equality audit
        shell: bash
        run: |
          set -euo pipefail
          python recovery_tool/maintenance/protocol043_analysis_recovery.py             --repo frozen --raw /tmp/p043raw --analysis /tmp/p043analysis             --science-run-id "$SCIENCE_RUN_ID" --recovery-run-id "$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RAW_ARTIFACT_ID" > /tmp/p043_raw_info.json
          python frozen/maintenance/protocol043_finalize.py artifact-index             --info /tmp/p043_raw_info.json             --raw-manifest /tmp/p043raw/science/scientific_raw_manifest.json             --out /tmp/p043analysis/artifact_index.json --run-id "$SCIENCE_RUN_ID"
          python frozen/maintenance/protocol043_finalize.py manifest             --root /tmp/p043analysis --out /tmp/p043analysis/analysis_manifest.json

      - name: Build recovered compact while preserving original invalid analysis
        shell: bash
        run: |
          set -euo pipefail
          COMPACT="frozen/artifacts/ftmoe_online/protocol_043/runs/run_$SCIENCE_RUN_ID"
          rm -rf "$COMPACT"
          python frozen/maintenance/protocol043_finalize.py compact             --science /tmp/p043raw/science --analysis /tmp/p043analysis --audit /tmp/p043raw/audit042 --dst "$COMPACT"
          cp -a /tmp/p043orig/analysis "$COMPACT/analysis_original_invalid_nan_equality"
          python frozen/maintenance/protocol043_publish.py prepare             --root frozen --compact "$COMPACT" --analysis-status /tmp/p043analysis/analysis_status.json --run-id "$SCIENCE_RUN_ID"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["COMPACT"])/"publication_status.json" if "COMPACT" in os.environ else pathlib.Path("frozen/artifacts/ftmoe_online/protocol_043/runs/run_37168746303/publication_status.json"); x=json.load(open(p)); x.update({"analysis_recovery_run_id":os.environ["GITHUB_RUN_ID"],"original_analysis_label":"invalid_execution","analysis_recovery_reason":"matching NaN contribution cells compared unequal by original np.array_equal","science_reexecuted":False}); p.write_text(json.dumps(x,indent=2)+"\n")'
          python frozen/maintenance/protocol043_finalize.py manifest             --root "$COMPACT" --out "$COMPACT/compact_manifest.json"

      - name: Upload recovered compact handoff
        uses: actions/upload-artifact@v4
        with:
          name: protocol043-compact-recovered-${{ github.run_id }}
          path: frozen/artifacts/ftmoe_online/protocol_043/runs/run_37168746303
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

      - name: Checkout latest main for result-only publication
        uses: actions/checkout@v4
        with:
          ref: main
          path: publish
          fetch-depth: 0

      - name: Publish recovered analysis to main
        shell: bash
        run: |
          set -euo pipefail
          SRC="frozen/artifacts/ftmoe_online/protocol_043/runs/run_$SCIENCE_RUN_ID"
          DST="publish/artifacts/ftmoe_online/protocol_043/runs/run_$SCIENCE_RUN_ID"
          rm -rf "$DST"
          mkdir -p "$(dirname "$DST")"
          cp -a "$SRC" "$DST"
          cp frozen/docs/PROTOCOL043_RESULTS.md publish/docs/PROTOCOL043_RESULTS.md
          cp frozen/AGENTS.md publish/AGENTS.md
          cp frozen/NEXT_EXPERIMENT_LATEST.md publish/NEXT_EXPERIMENT_LATEST.md
          cp frozen/PROJECT_CONTEXT_LATEST.md publish/PROJECT_CONTEXT_LATEST.md
          cp frozen/docs/GITHUB_EXPERIMENT_HANDOFF.md publish/docs/GITHUB_EXPERIMENT_HANDOFF.md
          cp frozen/README.md publish/README.md
          cd publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROTOCOL043_RESULTS.md "artifacts/ftmoe_online/protocol_043/runs/run_$SCIENCE_RUN_ID"             AGENTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md docs/GITHUB_EXPERIMENT_HANDOFF.md README.md
          git commit -m "results: recover Protocol043 analysis from sealed science run $SCIENCE_RUN_ID [skip ci]"
          git push origin HEAD:main

      - name: Mark recovered publication synced
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          PUB="artifacts/ftmoe_online/protocol_043/runs/run_$SCIENCE_RUN_ID/publication_status.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["PUB"]); x=json.load(open(p)); x.update({"publication_status":"synced_to_main","main_synced":True,"analysis_recovery_run_id":os.environ["GITHUB_RUN_ID"],"science_reexecuted":False}); p.write_text(json.dumps(x,indent=2)+"\n")'
          git add "$PUB"
          git commit -m "results: mark Protocol043 recovered analysis publication synced [skip ci]"
          git push origin HEAD:main
        env:
          PUB: artifacts/ftmoe_online/protocol_043/runs/run_37168746303/publication_status.json
