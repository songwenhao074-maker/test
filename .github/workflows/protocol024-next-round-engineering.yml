name: Protocol-024 next-round engineering gates

on:
  push:
    branches: [protocol-024-next-round-gpt56]
    paths:
      - 'ftmoe_protocol024_eval.py'
      - 'ftmoe_protocol024_dynamic_residual.py'
      - 'ftmoe_protocol024_session.py'
      - 'ftmoe_protocol024_lifecycle.py'
      - 'test_ftmoe_protocol024_eval.py'
      - 'test_ftmoe_protocol024_dynamic_residual.py'
      - 'test_ftmoe_protocol024_next_round_*.py'
      - 'maintenance/run_protocol024_next_round_integrity.py'
      - 'maintenance/run_protocol024_lifecycle_debug.py'
      - '.github/workflows/protocol024-next-round-engineering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install Protocol online dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3
      - name: Run inherited compatible and next-round unit gates
        run: |
          python -m unittest -v \
            test_ftmoe_protocol024_dynamic_residual.py \
            test_ftmoe_protocol024_eval.py \
            test_ftmoe_protocol024_next_round_eval.py \
            test_ftmoe_protocol024_next_round_dynamic.py \
            test_ftmoe_protocol024_next_round_session.py
      - name: Run real seed700 namespace and resume gate
        run: |
          python maintenance/run_protocol024_next_round_integrity.py \
            --out artifacts/ftmoe_online/protocol_024/next_round_v1/integrity_gates_ci.json
      - name: Run causal lifecycle toy, inflight-resume, and old-stream debug
        run: |
          python maintenance/run_protocol024_lifecycle_debug.py \
            --natural-intervals 760 \
            --out artifacts/ftmoe_online/protocol_024/next_round_v1/lifecycle_debug_ci.json
      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol024-next-round-engineering
          path: |
            artifacts/ftmoe_online/protocol_024/next_round_v1/integrity_gates_ci.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/lifecycle_debug_ci.json
          if-no-files-found: warn
