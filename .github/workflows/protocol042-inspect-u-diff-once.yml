name: Protocol042 inspect U discrete diffs once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol042-inspect-u-diff-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[p042r2-inspect-diff]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da5eaa7e71f44497ede538c884e7ca688e6afbf4
      - name: Compare sealed U logs to locked 041 raw
        shell: bash
        run: |
          set -euo pipefail
          for X in "11274660283 69190b023b4c0c2d9dfea3f2e5f84f0075f016298b047ed72a86395831d0a6b1 /tmp/u042.zip /tmp/u042"                    "11269043834 baa36f1fbb3489f76d8f0ffb5d8e4ebc88317e231bd934146e185ac2e4ffde6e /tmp/u041.zip /tmp/u041"; do
            set -- $X
            curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$1/zip" -o "$3"
            echo "$2  $3" | sha256sum -c -
            mkdir -p "$4"; unzip -q "$3" -d "$4"
          done
          python - <<'PY'
          import json, pathlib
          R=pathlib.Path('/tmp/u042/U_parent'); O=pathlib.Path('/tmp/u041/W_parent')
          specs={
            'birth_checks':('checks','birth_checks.json'),
            'candidate_decisions':('decisions','candidate_decisions.json'),
            'pressure_checks':('checks','pressure_checks.json'),
            'reuse_decisions':('decisions','reuse_decisions.json'),
            'sleep_checks':('checks','sleep_checks.json'),
          }
          IGN={'protocol','revision','arm','runtime_seconds','time_unix','action_seq'}
          def norm(x):
            if isinstance(x,dict): return {k:norm(v) for k,v in x.items() if k not in IGN}
            if isinstance(x,list): return [norm(v) for v in x]
            return x
          def diff(a,b,path=''):
            if type(a)!=type(b): return [(path,'TYPE',type(a).__name__,type(b).__name__,a,b)]
            if isinstance(a,dict):
              out=[]
              for k in sorted(set(a)|set(b)):
                if k not in a: out.append((path+'/'+k,'MISSING_NEW',None,b[k]))
                elif k not in b: out.append((path+'/'+k,'EXTRA_NEW',a[k],None))
                else: out.extend(diff(a[k],b[k],path+'/'+k))
                if len(out)>=30: return out
              return out
            if isinstance(a,list):
              if len(a)!=len(b): return [(path,'LEN',len(a),len(b))]
              out=[]
              for i,(x,y) in enumerate(zip(a,b)):
                out.extend(diff(x,y,f'{path}[{i}]'))
                if len(out)>=30: return out
              return out
            return [] if a==b else [(path,'VALUE',a,b)]
          for name,(key,fn) in specs.items():
            a=norm(json.load(open(R/fn))[key]); b=norm(json.load(open(O/fn))[key])
            ds=diff(a,b)
            print('\n###',name,'len',len(a),len(b),'DIFFS',len(ds))
            for x in ds[:30]: print(repr(x))
          PY
