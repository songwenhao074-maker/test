                z0=TT['z'][pf:].copy(); l0=TT['c_detection_logits'][pf:].copy(); y0=TT['labels'][pf:].copy()
                TT['z'][pf:]+=1234.0; TT['c_detection_logits'][pf:,0]-=777.0; TT['c_detection_logits'][pf:,1]+=777.0; TT['labels'][pf:]=np.where(TT['labels'][pf:]>0,0,1)
                perturb_applied=bool((not np.array_equal(z0,TT['z'][pf:])) and (not np.array_equal(l0,TT['c_detection_logits'][pf:])) and (not np.array_equal(y0,TT['labels'][pf:])))
                if not perturb_applied: raise AssertionError('future perturbation was not applied')
