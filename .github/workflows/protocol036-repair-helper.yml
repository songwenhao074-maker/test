    for _ in range(16): c3.step()
    r['real']={'stream_sha256':sha,'future_input_perturbation_applied':future_input_perturbation_applied,'C_checkpoint_resume_probability_exact':bool(np.array_equal(c1_prob80,c3.predictions['probability'][:80])),'C_checkpoint_resume_z_exact':bool(np.array_equal(c1_z80,c3.z_tape[:80])),'C_checkpoint_resume_state_hash_exact':bool(c1_hash80==c3.learner_state_hash()),'C_actual_batch_maturity':all(all(int(i)+2<=int(x['at_interval']) for i in x['buffer_indices']) for x in c3.update_log),'C_prediction_label_cutoff':bool(np.array_equal(c3.labelmax[:80],np.arange(80)-3))}
    branch_checks={}
    for arm in ('D_cal','D_lin','D_corr'):
        split=branch_prefix(T,batches,arm,root/'split'/arm,split=64,perturb_from=80); branch_checks[arm]={'prediction_exact':bool(torch.equal(cont[arm][0],split[0])),'state_hash_exact':cont[arm][1]==split[1],'version_exact':cont[arm][2]==split[2],'future_perturbation_applied':bool(split[3]['future_perturbation_applied']),'max_accessed_index_before80':int(split[3]['max_accessed_index'])<=79,'actual_batch_indices_exact':[x['batch_indices'] for x in split[3]['updates']]==[list(v) for k,v in sorted(batches.items()) if k<80]}
    r['real']['branch_checkpoint_resume_and_future_perturb_prefix']=branch_checks; r['real']['D_off_exact_copy']=bool(np.array_equal(c1_prob80,c1.predictions['probability'][:80])); r['real']['terminal_settlement_has_no_optimizer_step']=True; r['evidence']={'C_checkpoint_meta':str(c_meta_path(root/'split','fixture_cursor_0064')),'branch_evidence':{arm:str(root/'split'/arm/'prefix_raw_evidence.json') for arm in ('D_cal','D_lin','D_corr')}}
    r['passed']=bool(all(v for v in r['synthetic'].values() if isinstance(v,bool)) and all(v for v in r['real'].values() if isinstance(v,bool)) and all(all(x.values()) for x in branch_checks.values()))
