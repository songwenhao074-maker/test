name: Protocol036 deterministic preflight repair

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  EXECUTION_REF: codex/protocol-036-correction-controls-20260930

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[p036-repair]')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXECUTION_REF }}
          fetch-depth: 0

      - name: Repair deterministic audit code before any science
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Repair C causal-access boolean and make the real future-perturbation
