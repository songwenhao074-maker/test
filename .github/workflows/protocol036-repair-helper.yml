    pred=np.full((5968,16),np.nan,np.float32); delta=np.full((5968,16),np.nan,np.float32); logits=np.full((5968,16,2),np.nan,np.float32); versions=np.zeros(5968,np.int64); hashes=[]; logs=[]; ver=0; accessor=TapeAccessor(TT,arm); ledger=out_dir/'fixture_ledger.json'; perturb_applied=False
    if not ledger.exists(): W(ledger,default_ledger())
    for ti in range(end):
        zrow,crow=accessor.prediction(ti); c=torch.from_numpy(crow).float(); m=c[:,1]-c[:,0]; z=None if zrow is None else torch.from_numpy(zrow).float()
        with torch.no_grad(): d=b.delta(z,m); oo=compose(c,d); pp=torch.softmax(oo,-1)[:,1]
        pred[ti]=pp.numpy(); delta[ti]=d.numpy(); logits[ti]=oo.numpy(); versions[ti]=ver; hashes.append(bhash(b))
        if ti in batches:
            ii=list(batches[ti]); zz,mm,yy=accessor.training(ii,ti); zbt=None if zz is None else torch.from_numpy(zz).float(); mt=torch.from_numpy(mm).float(); yt=torch.from_numpy((yy>0).astype(np.float32)); dd=b.delta(zbt,mt); loss=F.binary_cross_entropy_with_logits(mt+dd,yt)+.001*(dd**2).mean(); opt.zero_grad(set_to_none=True); loss.backward(); torch.nn.utils.clip_grad_norm_(b.parameters(),1); opt.step(); ver+=1; logs.append({'at_interval':ti,'batch_indices':[int(x) for x in ii]})
        if split is not None and ti+1==split:
