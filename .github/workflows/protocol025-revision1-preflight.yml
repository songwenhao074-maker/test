name: Protocol-025 revision-1 pre-generation semantic gate

on:
  workflow_dispatch:
  push:
    branches: [protocol-025-revision1-gpt56-20260916]
    paths:
      - 'simulator/workload/BitbrainWorkloadProtocol025.py'
      - 'test_ftmoe_protocol025_generation.py'
      - 'audit_ftmoe_protocol025_revision1.py'
      - 'artifacts/ftmoe_online/protocol_025/registration.json'
      - 'artifacts/ftmoe_online/protocol_025/data_revision_001.json'
      - '.github/workflows/protocol025-revision1-preflight.yml'

permissions:
  contents: read

jobs:
  semantic-preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install generation dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3 dill==0.3.8
      - name: Verify single revision registration and sealed seeds
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/ftmoe_online/protocol_025/registration.json'))
          d=json.load(open('artifacts/ftmoe_online/protocol_025/data_revision_001.json'))
          assert r['development_seed']==700 and r['model_seed']==1
          assert r['confirmation_seeds_forbidden']==[701,702,703]
          assert r['test_seeds_forbidden']==[201,202,203,204,205]
          assert r['data_revision']['used_count']==1
          assert r['data_revision']['active_revision_id']=='data_revision_001'
          assert r['data_revision']['pre_revision_stream_eligible_for_model_results'] is False
          assert r['data_revision']['no_further_data_revision_allowed'] is True
          assert d['revision_number']==1 and d['uses_only_allowed_data_revision'] is True
          assert d['registered_before_any_protocol025_model_result'] is True
          print({'revision':'data_revision_001','pre_revision_run':d['pre_revision_generation_run'],'model_results_seen':False})
          PY
      - name: Compile collector and strengthened audit
        run: |
          python -m py_compile simulator/workload/BitbrainWorkloadProtocol025.py prepare_ftmoe_protocol025_stream.py audit_ftmoe_protocol025_revision1.py maintenance/run_protocol025_stream_collect.py test_ftmoe_protocol025_generation.py
      - name: Run registered generation semantics tests
        run: |
          python -m unittest -v test_ftmoe_protocol025_generation.py
      - name: Assert no Protocol025 model result exists
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('artifacts/ftmoe_online/protocol_025')
          forbidden=['comparison.json','development_results.json','model_status.json']
          found=[str(p) for x in forbidden for p in root.rglob(x)]
          assert not found,found
          print({'model_results_seen':False,'generation_not_started_by_this_workflow':True})
          PY
