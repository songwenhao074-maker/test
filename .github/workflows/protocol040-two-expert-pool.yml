name: Protocol-040 two expert pool

on:
  workflow_dispatch:
    inputs:
      execution_ref:
        description: Frozen Protocol040 execution branch
        required: true
        type: string
      expected_execution_sha:
        description: Exact frozen checkout SHA
        required: true
        type: string
      resume_artifact_id:
        description: Optional interrupted Protocol040 raw artifact ID for exact resume
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: protocol040-science
  cancel-in-progress: false

jobs:
  protocol040:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EXECUTION_REF: ${{ inputs.execution_ref }}
      EXPECTED_EXECUTION_SHA: ${{ inputs.expected_execution_sha }}
      RESUME_ARTIFACT_ID: ${{ inputs.resume_artifact_id }}
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "1"

    steps:
      - name: Checkout exact frozen Protocol040 execution SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_execution_sha }}
          fetch-depth: 0

      - name: Enforce checkout registration kernels and duplicate budget
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EXECUTION_SHA"
          git fetch origin "$EXECUTION_REF" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_EXECUTION_SHA"
          python maintenance/validate_protocol040_plan.py
          test "$(sha256sum artifacts/ftmoe_online/protocol_040/plan.json | awk '{print $1}')" = "97839cb55ea9d00521e15529e5b5505004c69fd9587d2d22503b7b1ff99dcd35"
          test "$(git hash-object run_ftmoe_protocol037.py)" = "1d18b5b5da8133d80e7d6f2e561840ceeec27d9e"
          test "$(git hash-object run_ftmoe_protocol039.py)" = "ad5a115646462e1aa58eb06be7f836fa2a567f78"
          test "$(git hash-object analyze_ftmoe_protocol037.py)" = "4328ad21e11b01a0bba22cf3c113d12b9ef0d98d"
          test "$(git hash-object analyze_ftmoe_protocol039.py)" = "d8b32e3c845144f684c97767d53af053c56c9a53"
          test "$(git hash-object protocol035_common.py)" = "861e84692a2fe9a80c8952e837f78325b66f7ae3"
          python -m py_compile run_ftmoe_protocol040.py analyze_ftmoe_protocol040.py             maintenance/validate_protocol040_plan.py maintenance/materialize_protocol040_sources.py maintenance/protocol040_finalize.py
          if [ -z "$RESUME_ARTIFACT_ID" ]; then
            COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired==false and (.name|startswith("protocol040-raw-")))] | length')"
            test "$COUNT" = "0" || { echo "existing Protocol040 raw artifact found; refuse duplicate fresh science launch"; exit 1; }
          fi

      - name: Setup Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install frozen CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          python -m pip install numpy==1.24.4 psutil==5.9.8
          python -m pip freeze > /tmp/protocol040_pip_freeze.txt

      - name: Download verify and materialize exact Protocol036 and Protocol039 inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p036_zip /tmp/p039_zip /tmp/source036 /tmp/source039
          mkdir -p /tmp/p036_zip /tmp/p039_zip /tmp/source036 /tmp/source039
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11147931152/zip" -o /tmp/p036.zip
          echo "040bacac8f23659f56599b71d6d6706b62a544e44161c7c42fb5af73650f56c0  /tmp/p036.zip" | sha256sum -c -
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11216467452/zip" -o /tmp/p039.zip
          echo "03a25b90b28f09f3dab3f1704a3d52053b0750f3616f3c0ed03dbda374c2ae0a  /tmp/p039.zip" | sha256sum -c -
          unzip -q /tmp/p036.zip -d /tmp/p036_zip
          unzip -q /tmp/p039.zip -d /tmp/p039_zip
          python maintenance/materialize_protocol040_sources.py             --extracted036 /tmp/p036_zip --extracted039 /tmp/p039_zip             --out036 /tmp/source036 --out039 /tmp/source039             --report /tmp/protocol040_materialization.json

      - name: Run production-entrypoint fixtures and one bounded zero-gradient real prefix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/protocol040_preflight
          python run_ftmoe_protocol040.py preflight             --source036 /tmp/source036 --source039 /tmp/source039 --out-dir /tmp/protocol040_preflight
          python - <<'PY'
          import json
          p=json.load(open('/tmp/protocol040_preflight/fixture_report.json'))
          assert p['all_pass'] is True
          assert p['real_engineering_prefixes']==1
          assert p['real_engineering_prefix_intervals_max']<=256
          assert p['real_engineering_gradient_steps']==0
          PY

      - name: Record frozen implementation provenance before science
        shell: bash
        run: |
          set -euo pipefail
          SCI_ROOT="artifacts/ftmoe_online/protocol_040/runtime/run_$GITHUB_RUN_ID"
          mkdir -p "$SCI_ROOT"
          python maintenance/protocol040_finalize.py provenance             --out "$SCI_ROOT/implementation_manifest.json" --run-id "$GITHUB_RUN_ID"             --checkout-sha "$(git rev-parse HEAD)"             --plan artifacts/ftmoe_online/protocol_040/plan.json             --workflow .github/workflows/protocol040-two-expert-pool.yml             --pip-freeze /tmp/protocol040_pip_freeze.txt             --file run_ftmoe_protocol040.py             --file analyze_ftmoe_protocol040.py             --file maintenance/validate_protocol040_plan.py             --file maintenance/materialize_protocol040_sources.py             --file maintenance/protocol040_finalize.py             --file run_ftmoe_protocol037.py --file run_ftmoe_protocol039.py             --file analyze_ftmoe_protocol037.py --file analyze_ftmoe_protocol039.py             --file protocol035_common.py
          cp /tmp/protocol040_preflight/fixture_report.json "$SCI_ROOT/fixture_report.pre_science.json"
          cp /tmp/protocol040_materialization.json "$SCI_ROOT/source_materialization.json"

      - name: Restore exact interrupted Protocol040 state only when explicitly requested
        if: inputs.resume_artifact_id != ''
        shell: bash
        run: |
          set -euo pipefail
          SCI_ROOT="artifacts/ftmoe_online/protocol_040/runtime/run_$GITHUB_RUN_ID"
          rm -rf /tmp/p040_resume
          mkdir -p /tmp/p040_resume
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$RESUME_ARTIFACT_ID/zip" -o /tmp/p040_resume.zip
          unzip -q /tmp/p040_resume.zip -d /tmp/p040_resume
          cp "$SCI_ROOT/implementation_manifest.json" /tmp/protocol040_current_implementation_manifest.json
          cp -a /tmp/p040_resume/. "$SCI_ROOT"/
          cp /tmp/protocol040_current_implementation_manifest.json "$SCI_ROOT/implementation_manifest.json"
          test -f "$SCI_ROOT/checkpoints/latest.pt"
          test -f "$SCI_ROOT/checkpoints/latest.json"

      - name: Execute the single registered D_pool2 scientific sequence
        id: science
        shell: bash
        run: |
          set +e
          SCI_ROOT="artifacts/ftmoe_online/protocol_040/runtime/run_$GITHUB_RUN_ID"
          RESUME_ARGS=()
          if [ -n "$RESUME_ARTIFACT_ID" ]; then
            RESUME_ARGS=(--resume-checkpoint "$SCI_ROOT/checkpoints/latest.pt")
          fi
          python run_ftmoe_protocol040.py science             --source036 /tmp/source036 --source039 /tmp/source039             --out-dir "$SCI_ROOT" --run-id "$GITHUB_RUN_ID"             --fixture-report /tmp/protocol040_preflight/fixture_report.json             "${RESUME_ARGS[@]}"
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seal immutable raw scientific manifest
        if: always() && steps.science.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          SCI_ROOT="artifacts/ftmoe_online/protocol_040/runtime/run_$GITHUB_RUN_ID"
          test -d "$SCI_ROOT"
          python maintenance/protocol040_finalize.py manifest --root "$SCI_ROOT" --out "$SCI_ROOT/scientific_raw_manifest.json"

      - name: Upload raw Protocol040 artifact before analysis
        id: raw_upload
        if: always() && steps.science.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: protocol040-raw-${{ github.run_id }}
          path: artifacts/ftmoe_online/protocol_040/runtime/run_${{ github.run_id }}
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

      - name: Stop after preserved interrupted or invalid evidence
        if: steps.science.outputs.rc != '0'
        shell: bash
        run: |
          echo "Protocol040 science did not complete validly; raw evidence uploaded. No automatic rerun."
          exit 1

      - name: Analyze sealed Protocol040 comparisons only
        if: steps.science.outputs.rc == '0'
        shell: bash
        env:
          RAW_ARTIFACT_ID: ${{ steps.raw_upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          SCI_ROOT="artifacts/ftmoe_online/protocol_040/runtime/run_$GITHUB_RUN_ID"
          ANALYSIS_ROOT="/tmp/protocol040_analysis"
          rm -rf "$ANALYSIS_ROOT"; mkdir -p "$ANALYSIS_ROOT"
          python analyze_ftmoe_protocol040.py             --science-root "$SCI_ROOT" --manifest /tmp/source036/inputs/seed3601/manifest.json             --output-dir "$ANALYSIS_ROOT" --docs-output docs/PROTOCOL040_RESULTS.md --run-id "$GITHUB_RUN_ID"
          cp docs/PROTOCOL040_RESULTS.md "$ANALYSIS_ROOT/PROTOCOL040_RESULTS.md"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RAW_ARTIFACT_ID" > /tmp/protocol040_raw_artifact_info.json
          python maintenance/protocol040_finalize.py artifact-index             --info /tmp/protocol040_raw_artifact_info.json --raw-manifest "$SCI_ROOT/scientific_raw_manifest.json"             --out "$ANALYSIS_ROOT/artifact_index.json" --run-id "$GITHUB_RUN_ID"
          python maintenance/protocol040_finalize.py manifest --root "$ANALYSIS_ROOT" --out "$ANALYSIS_ROOT/analysis_manifest.json"

      - name: Build and upload compact handoff
        id: compact_upload
        if: steps.science.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          SCI_ROOT="artifacts/ftmoe_online/protocol_040/runtime/run_$GITHUB_RUN_ID"
          COMPACT="artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID"
          rm -rf "$COMPACT"
          python maintenance/protocol040_finalize.py compact --science "$SCI_ROOT" --analysis /tmp/protocol040_analysis --dst "$COMPACT"
          echo '{"protocol":"040","publication_status":"pending_main_sync"}' > "$COMPACT/publication_status.json"

      - name: Upload compact Protocol040 handoff
        if: steps.science.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: protocol040-compact-${{ github.run_id }}
          path: artifacts/ftmoe_online/protocol_040/runs/run_${{ github.run_id }}
          retention-days: 90
          compression-level: 6
          if-no-files-found: error

      - name: Write terminal pointers
        if: steps.science.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          STATUS="/tmp/protocol040_analysis/analysis_status.json"
          LABEL="$(python -c "import json;print(json.load(open('$STATUS'))['result_label'])")"
          cat > AGENTS.md <<EOF
          # Active Experiment Directive — Protocol-040 completed

          Protocol-040 scientific execution is complete in run $GITHUB_RUN_ID. Result label: $LABEL.

          Read docs/PROTOCOL040_RESULTS.md and artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID/. Historical033–040 scientific budgets are closed and immutable.

          Stop after Protocol-040. No threshold tuning, extra seed/stream, second candidate retry, permanent deletion, F research, or automatic next protocol is authorized. A new registered instruction and user handoff are required before further science.
          EOF
          cat > NEXT_EXPERIMENT_LATEST.md <<EOF
          # Protocol-040 已完成，停止等待分析

          Protocol-040 run $GITHUB_RUN_ID 已完成，结果标签 **$LABEL**。

          请读取 docs/PROTOCOL040_RESULTS.md 与 artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID/。本轮只新增一条 D_pool2 科学序列，C/B/D_keep/D_039 均未重训，F 保持 DEFERRED。

          040 到此停止。不自动调阈值、追加候选、增加 seed/新流、永久删除、恢复 F 或启动下一协议。
          EOF
          cat > PROJECT_CONTEXT_LATEST.md <<EOF
          # Project Context Latest

          Latest bounded science is Protocol-040 run $GITHUB_RUN_ID, result label **$LABEL**. Read docs/PROTOCOL040_RESULTS.md and artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID/.

          Protocol-040 tested one D_pool2 sequence on observed seed3601 with cached C/B/D_keep/D_039 controls. It allowed at most two dynamic expert IDs, one deployed expert, repeated sleep/reactivation, one bounded second-shadow attempt, and no permanent deletion. F was not loaded.

          Historical033–040 budgets are closed. Any new stream, deletion, F research, threshold change, extra seed, or Protocol-041 requires a separate preregistration and user handoff.
          EOF
          cat > docs/GITHUB_EXPERIMENT_HANDOFF.md <<EOF
          # 当前交接：Protocol-040 已完成

          Protocol-040 run $GITHUB_RUN_ID 已完成，结果标签 **$LABEL**。结果见 [PROTOCOL040_RESULTS.md](PROTOCOL040_RESULTS.md)，紧凑证据见 ../artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID/。

          本轮唯一 D_pool2 科学序列已消费并关闭；C/B/D_keep/D_039 均为缓存控制，F 未加载。原始证据先上传 Actions artifact，Git 中保存 artifact_index、紧凑结果、生命周期/候选/复用决策及成本。

          不自动启动下一协议，不重跑 040，不改阈值凑第二专家或复用事件。后续模型先读取本结果与 compact evidence，再由新的预登记指示和用户交接决定下一步。
          EOF
          cat > README.md <<EOF
          # PreGAN+ / FT-MoE 在线实验

          目标：在合理部署场景中，通过结构修改，使保留动态新增、知识保存/选择、休眠复用及容量管理思想的完整D优于持续学习C。

          **最新完成：[Protocol-040 最小双专家动态池](docs/PROTOCOL040_RESULTS.md)，run $GITHUB_RUN_ID，结果标签 $LABEL。**

          [当前交接](docs/GITHUB_EXPERIMENT_HANDOFF.md) / [040紧凑证据](artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID/) / [040冻结方案](docs/PROTOCOL040_TWO_EXPERT_POOL_20261003.md)

          本轮只新训练一条D_pool2序列；C/B/D_keep/D_039不重训，F未加载。结果仅属于已观察seed3601开发证据，不能自动外推为跨流确认、复用因果优势、完整动态删除成功或整体部署加速。

          Protocol-040到此停止。历史数据、源码、checkpoint和失败结果保留。[历史索引](docs/HISTORICAL_EXPERIMENTS.md) / [许可证](LICENSE)。
          EOF

      - name: Commit compact results to frozen execution branch
        if: steps.science.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROTOCOL040_RESULTS.md "artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID"             AGENTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md docs/GITHUB_EXPERIMENT_HANDOFF.md README.md
          git commit -m "results: Protocol040 two-expert pool run $GITHUB_RUN_ID [skip ci]"
          RESULT_COMMIT="$(git rev-parse HEAD)"
          echo "$RESULT_COMMIT" > /tmp/protocol040_result_commit.txt
          git push origin HEAD:"$EXECUTION_REF"

      - name: Publish result-only fast-forward commit to latest main
        if: steps.science.outputs.rc == '0'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          RESULT_COMMIT="$(cat /tmp/protocol040_result_commit.txt)"
          SUCCESS=0
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B protocol040-publish origin/main
            git checkout "$RESULT_COMMIT" -- docs/PROTOCOL040_RESULTS.md "artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID"               AGENTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md docs/GITHUB_EXPERIMENT_HANDOFF.md README.md
            git add docs/PROTOCOL040_RESULTS.md "artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID"               AGENTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md docs/GITHUB_EXPERIMENT_HANDOFF.md README.md
            git commit -m "results: publish completed Protocol040 run $GITHUB_RUN_ID [skip ci]" || true
            if git push origin HEAD:main; then SUCCESS=1; break; fi
          done
          if [ "$SUCCESS" != 1 ]; then
            echo "publication_pending: unable to fast-forward latest main after 3 attempts"
            exit 1
          fi
          echo "main_synced=true" >> "$GITHUB_OUTPUT"

      - name: Record publication success on main and execution branch
        if: steps.science.outputs.rc == '0' && steps.publish.outputs.main_synced == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PUB="artifacts/ftmoe_online/protocol_040/runs/run_$GITHUB_RUN_ID/publication_status.json"
          printf '{"protocol":"040","run_id":"%s","publication_status":"synced_to_main","main_synced":true}\n' "$GITHUB_RUN_ID" > "$PUB"
          git add "$PUB"
          git commit -m "results: mark Protocol040 publication synced [skip ci]"
          git push origin HEAD:main

          git fetch origin "$EXECUTION_REF"
          git checkout -B protocol040-exec-final FETCH_HEAD
          printf '{"protocol":"040","run_id":"%s","publication_status":"synced_to_main","main_synced":true}\n' "$GITHUB_RUN_ID" > "$PUB"
          git add "$PUB"
          git commit -m "results: mark Protocol040 publication synced [skip ci]"
          git push origin HEAD:"$EXECUTION_REF"

      - name: Confirm terminal bounded stop
        if: steps.science.outputs.rc == '0'
        run: echo "Protocol040 completed. No automatic next protocol will be launched."
