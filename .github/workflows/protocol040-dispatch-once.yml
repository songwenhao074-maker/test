name: Protocol040 dispatch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol040-dispatch-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[p040-dispatch-once]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen Protocol040 execution SHA
        uses: actions/checkout@v4
        with:
          ref: eff3235acc83beb6be73fd95b21f9ea2f830f410
          fetch-depth: 1

      - name: Validate frozen registration and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "eff3235acc83beb6be73fd95b21f9ea2f830f410"
          python maintenance/validate_protocol040_plan.py
          test "$(sha256sum artifacts/ftmoe_online/protocol_040/plan.json | awk '{print $1}')" = "97839cb55ea9d00521e15529e5b5505004c69fd9587d2d22503b7b1ff99dcd35"
          python -m py_compile             run_ftmoe_protocol040.py analyze_ftmoe_protocol040.py             maintenance/validate_protocol040_plan.py             maintenance/materialize_protocol040_sources.py             maintenance/protocol040_finalize.py

      - name: Dispatch frozen Protocol040 exactly once
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const execBranch = 'codex/protocol-040-two-expert-pool-20261003';
            const execSha = 'eff3235acc83beb6be73fd95b21f9ea2f830f410';
            const br = await github.rest.repos.getBranch({owner, repo, branch: execBranch});
            if (br.data.commit.sha !== execSha) {
              core.setFailed('execution branch SHA mismatch: '+br.data.commit.sha);
              return;
            }
            const arts = await github.rest.actions.listArtifactsForRepo({owner, repo, per_page: 100});
            if (arts.data.artifacts.some(a => !a.expired && a.name.startsWith('protocol040-raw-'))) {
              core.setFailed('Protocol040 raw artifact already exists; refuse duplicate fresh launch');
              return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'protocol040-two-expert-pool.yml', per_page: 20
            });
            if (runs.data.workflow_runs.some(r => r.status === 'queued' || r.status === 'in_progress')) {
              core.setFailed('formal Protocol040 run already active');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'protocol040-two-expert-pool.yml',
              ref: 'main',
              inputs: {
                execution_ref: execBranch,
                expected_execution_sha: execSha,
                resume_artifact_id: ''
              }
            });
            core.info('Protocol040 dispatched at '+execSha);
