name: Protocol037 frozen code compile only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol037-compile-check-once.yml'

permissions:
  contents: read

jobs:
  compile:
    if: contains(github.event.head_commit.message, '[p037-compile-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 57346b6f0357a38f6f2fe6839da07a8a4cf53be9
          fetch-depth: 1
      - name: Validate registration
        run: python maintenance/validate_protocol037_plan.py
      - name: Compile frozen Protocol037 code
        run: python -m py_compile run_ftmoe_protocol037.py analyze_ftmoe_protocol037.py maintenance/protocol037_finalize.py
