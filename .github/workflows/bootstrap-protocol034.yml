name: Bootstrap Protocol034

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-protocol034.yml

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Protocol034
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'protocol034-three-hypotheses.yml',
              ref: 'main',
              inputs: {
                execution_ref: 'codex/protocol-034-three-hypotheses-20260928'
              }
            })
