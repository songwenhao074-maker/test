name: Protocol-030 paired passive diagnostic

on:
  push:
    branches: [protocol-030-paired-diagnostic-20260922]
    paths:
      - .github/workflows/protocol030-paired-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: protocol030-single-paired-diagnostic
  cancel-in-progress: false

jobs:
  protocol030:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "1"
      STREAM_ROOT: artifacts/ftmoe_online/protocol_025/data_seed700
      RUN_DIR: artifacts/ftmoe_online/protocol_030/runtime/run_${{ github.run_id }}
      SOURCE_028_ROOT: /tmp/protocol028-source
      SOURCE_029_ROOT: /tmp/protocol029-source
      P030_REG: artifacts/ftmoe_online/protocol_030/registration.json
      P028_REG: artifacts/ftmoe_online/protocol_028/registration.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install frozen Protocol-030 dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3 dill==0.3.8 psutil

      - name: Compile and run targeted Protocol-030 checks
        run: |
          python -m py_compile \
            ftmoe_protocol030_paired.py \
            run_ftmoe_protocol030_paired.py \
            finalize_ftmoe_protocol030.py \
            ftmoe_protocol029_memory_utility.py \
            ftmoe_protocol028_memory_protected.py
          python -m unittest -v \
            test_ftmoe_protocol030.py \
            test_ftmoe_protocol029.py \
            test_ftmoe_protocol028.py

      - name: Download exact frozen data from Protocol-027
        uses: actions/download-artifact@v4
        with:
          name: protocol027-frozen-data-35682811782
          path: ${{ env.STREAM_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35682811782

      - name: Verify frozen data unchanged
        run: python ftmoe_protocol027_data.py --data-root "$STREAM_ROOT" --verify-only

      - name: Download historical Protocol-028 evidence
        uses: actions/download-artifact@v4
        with:
          name: protocol028-single-pilot-35705211072
          path: ${{ env.SOURCE_028_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35705211072

      - name: Download historical Protocol-029 evidence
        uses: actions/download-artifact@v4
        with:
          name: protocol029-memory-utility-35711135230
          path: ${{ env.SOURCE_029_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35711135230

      - name: Verify source artifact metadata and unpacked evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUN_DIR"
          python - <<'PY'
          import json, os, pathlib, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          expected=[
            (10675401651,35682811782,"protocol027-frozen-data-35682811782",
             "sha256:111a4c5fc5c508a9e169fdbffe823ee36dc66c037c1775a6aa1abdbaba31c0a1"),
            (10684617851,35705211072,"protocol028-single-pilot-35705211072",
             "sha256:e3be1c97d0f629c9ed40f61cfd4561b6b04e37b68357a2c92a23ac8f14e2e27e"),
            (10688265540,35711135230,"protocol029-memory-utility-35711135230",
             "sha256:56c5cbe760cea17abeb62b9bbb3d30116ecef338f2fcaa9afda3fe0eaf80bb16"),
          ]
          rows=[]
          for aid,rid,name,digest in expected:
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}",
                  headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req) as resp:
                  meta=json.load(resp)
              checks={
                  "artifact_id":meta.get("id")==aid,
                  "name":meta.get("name")==name,
                  "digest":meta.get("digest")==digest,
                  "run_id":(meta.get("workflow_run") or {}).get("id")==rid,
                  "not_expired":meta.get("expired") is False,
              }
              if not all(checks.values()):
                  raise SystemExit(f"artifact metadata mismatch {aid}: {checks}, got={meta}")
              rows.append({"artifact_id":aid,"run_id":rid,"name":name,"digest":digest,
                           "verified_from_github_api":True,"checks":checks})
          p28=pathlib.Path(os.environ["SOURCE_028_ROOT"])
          p29=pathlib.Path(os.environ["SOURCE_029_ROOT"])
          required028=[
              p28/"comparison.json",
              p28/"D_memory_protected"/"predictions.npz",
              p28/"D_memory_protected"/"lifecycle.jsonl",
              p28/"D_memory_protected"/"lifecycle_summary.json",
              p28/"D_memory_protected"/"opportunity_accounting.json",
          ]
          required029=[p29/"diagnostic_summary.json",p29/"consistency.json",p29/"opportunity_audit_full.json"]
          missing=[str(p) for p in required028+required029 if not p.is_file()]
          if missing: raise SystemExit("missing unpacked source evidence: "+", ".join(missing))
          root=pathlib.Path(os.environ["RUN_DIR"])
          (root/"source_artifacts.json").write_text(json.dumps({
              "verified":True,"artifacts":rows,
              "protocol028_required_files_present":True,
              "protocol029_required_files_present":True,
          },indent=2)+"\n")
          PY

      - name: Re-run inherited physical causal and coverage eligibility
        run: |
          python audit_ftmoe_protocol027.py --data-root "$STREAM_ROOT" --output-root "$RUN_DIR"

      - name: Record deterministic environment
        run: |
          python -m pip freeze > "$RUN_DIR/pip_freeze.txt"
          python - <<'PY'
          import hashlib, json, os, pathlib, platform
          import torch
          torch.set_num_threads(1)
          torch.set_num_interop_threads(1)
          torch.use_deterministic_algorithms(True, warn_only=False)
          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1024*1024),b""):h.update(b)
              return h.hexdigest()
          files=[
              "artifacts/ftmoe_online/protocol_030/registration.json",
              "artifacts/ftmoe_online/protocol_028/registration.json",
              "ftmoe_protocol030_paired.py","run_ftmoe_protocol030_paired.py",
              "ftmoe_protocol029_memory_utility.py","ftmoe_protocol028_memory_protected.py",
          ]
          cpu=pathlib.Path("/proc/cpuinfo").read_text(errors="replace") if pathlib.Path("/proc/cpuinfo").exists() else ""
          env={
              "python":platform.python_version(),"platform":platform.platform(),
              "torch":torch.__version__,"torch_config":torch.__config__.show(),
              "torch_num_threads":torch.get_num_threads(),
              "torch_num_interop_threads":torch.get_num_interop_threads(),
              "deterministic_algorithms":torch.are_deterministic_algorithms_enabled(),
              "OMP_NUM_THREADS":os.environ.get("OMP_NUM_THREADS"),
              "MKL_NUM_THREADS":os.environ.get("MKL_NUM_THREADS"),
              "OPENBLAS_NUM_THREADS":os.environ.get("OPENBLAS_NUM_THREADS"),
              "PYTHONHASHSEED":os.environ.get("PYTHONHASHSEED"),
              "cpuinfo":cpu,
              "file_sha256":{p:sha(p) for p in files},
          }
          root=pathlib.Path(os.environ["RUN_DIR"])
          (root/"environment.json").write_text(json.dumps(env,indent=2)+"\n")
          (root/"workflow_execution.json").write_text(json.dumps({
              "protocol":"030","github_run_id":os.environ["GITHUB_RUN_ID"],
              "head_sha":os.environ["GITHUB_SHA"],"branch":os.environ["GITHUB_REF_NAME"],
              "event":os.environ["GITHUB_EVENT_NAME"],"full_replay_budget":2,
              "executions":["audit_off","audit_on"],"C_rerun":False,
              "new_scientific_methods":0,"simulation":False,
          },indent=2)+"\n")
          PY

      - name: Run exactly the registered audit_off and audit_on pair
        run: |
          python run_ftmoe_protocol030_paired.py \
            --stream "$STREAM_ROOT" \
            --out-root "$RUN_DIR" \
            --registration "$P030_REG" \
            --protocol028-registration "$P028_REG" \
            --source-028-root "$SOURCE_028_ROOT" \
            --source-artifacts "$RUN_DIR/source_artifacts.json" \
            --data-lock "$RUN_DIR/data_lock.json" \
            --eligibility "$RUN_DIR/eligibility.json" \
            --run-id "$GITHUB_RUN_ID"

      - name: Persist status if paired runner stopped early
        if: always()
        run: |
          python finalize_ftmoe_protocol030.py --status-only \
            --run-root "$RUN_DIR" \
            --git-dest "artifacts/ftmoe_online/protocol_030/runs/run_${GITHUB_RUN_ID}" \
            --run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY"

      - name: Upload complete Protocol-030 evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: protocol030-paired-diagnostic-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}/
          if-no-files-found: warn
          compression-level: 3
          retention-days: 90

      - name: Build Protocol-030 report and compact handoff
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python finalize_ftmoe_protocol030.py \
            --run-root "$RUN_DIR" \
            --git-dest "artifacts/ftmoe_online/protocol_030/runs/run_${GITHUB_RUN_ID}" \
            --run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" --artifact-url "$ARTIFACT_URL" \
            --artifact-digest "$ARTIFACT_DIGEST"

      - name: Commit compact Protocol-030 results and handoff
        if: always()
        run: |
          git config user.name "protocol030-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/PROTOCOL030_RESULTS.md docs/GITHUB_EXPERIMENT_HANDOFF.md \
            AGENTS.md README.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md \
            artifacts/ftmoe_online/protocol_030/runs/
          git commit -m "results: record Protocol030 paired diagnostic run ${GITHUB_RUN_ID}" || true
          git fetch origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Final Protocol-030 completion gate
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path("artifacts/ftmoe_online/protocol_030/runs")/("run_"+os.environ["GITHUB_RUN_ID"])/"status.json"
          if not p.is_file(): raise SystemExit("Protocol030 compact status missing")
          s=json.loads(p.read_text())
          print(json.dumps(s,indent=2))
          if s.get("C_rerun") is not False or s.get("new_scientific_methods") != 0:
              raise SystemExit("Protocol030 scientific-boundary violation")
          if int(s.get("full_replays_started",0)) > 2:
              raise SystemExit("Protocol030 replay budget exceeded")
          if s.get("automatic_followups_started"):
              raise SystemExit("Protocol030 automatic follow-up forbidden")
          if not s.get("completed"):
              raise SystemExit("Protocol030 paired execution incomplete; documented blocker preserved")
          print("Protocol030 reached registered stop point; paired_audit_valid=",s.get("paired_audit_valid"))
          PY
