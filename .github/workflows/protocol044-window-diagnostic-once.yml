name: Protocol044 window resume diagnostic once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol044-window-diagnostic-once.yml']
permissions:
  contents: read
jobs:
  diag:
    if: contains(github.event.head_commit.message, '[p044-window-diag]')
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/protocol-044-closeout-capacity-20261004
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.18'
      - name: Install fixed deps and inspect window checkpoint
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          python -m pip install numpy==1.24.4 psutil==5.9.8
          rm -rf /tmp/p044diag && mkdir -p /tmp/p044diag
          python run_ftmoe_protocol044.py continuous-case --case window_expiry_after --root /tmp/p044diag
          python run_ftmoe_protocol044.py prepare-case --case window_expiry_after --root /tmp/p044diag
          python - <<'PY'
          import json, torch
          from pathlib import Path
          root=Path('/tmp/p044diag/window_expiry_after/resume')
          cp=root/'checkpoints/latest.pt'
          x=torch.load(cp,map_location='cpu',weights_only=False)
          p=root/'streams/settlements.jsonl'
          rows=[json.loads(q) for q in p.read_text().splitlines()]
          print(json.dumps({
            'checkpoint_cursor':x['cursor'],
            'checkpoint_next_substep':x['next_substep'],
            'checkpoint_audit_settlements':x['audit_state'].get('settlements'),
            'disk_settlement_count':len(rows),
            'disk_last5':[r['settled_interval'] for r in rows[-5:]],
            'settled_sum_checkpoint':int(x.get('settled_sum',-1)) if 'settled_sum' in x else None,
          },indent=2))
          PY
          python run_ftmoe_protocol044.py resume-case --case window_expiry_after --root /tmp/p044diag || true
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/p044diag/window_expiry_after')
          r=json.loads((root/'result.json').read_text())
          p=root/'resume/streams/settlements.jsonl'
          rows=[json.loads(q) for q in p.read_text().splitlines()]
          print(json.dumps({
            'result_pass':r['pass'],
            'diff_keys':r.get('diff_keys'),
            'final_disk_settlement_count':len(rows),
            'final_disk_last5':[q['settled_interval'] for q in rows[-5:]],
            'continuous_audit':r.get('continuous_state_diff',{}).get('audit_state',{}).get('settlements'),
            'resumed_audit':r.get('resumed_state_diff',{}).get('audit_state',{}).get('settlements')
          },indent=2))
          PY
