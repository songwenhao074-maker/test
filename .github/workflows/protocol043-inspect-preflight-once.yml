name: Protocol043 inspect preflight fixture once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol043-inspect-preflight-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[p043-inspect-fixture]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download fixture artifact and print failures
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11278244520/zip" -o /tmp/e.zip
          echo "a24444cf0bf29a614133e309259ef803265b50f359bf7fbc052e37bf5636085a  /tmp/e.zip" | sha256sum -c -
          rm -rf /tmp/e && mkdir /tmp/e && unzip -q /tmp/e.zip -d /tmp/e
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/e/preflight/fixture_report.json')
          x=json.load(open(p))
          print('REAL_PREFIXES',x.get('real_engineering_prefixes'))
          print('ALL_PASS',x.get('all_pass'))
          for r in x.get('fixtures',[]):
              if r.get('pass') is not True:
                  print('\nFAIL',r.get('test_id'))
                  print(json.dumps(r,indent=2))
          q=pathlib.Path('/tmp/e/preflight/preflight_exception.json')
          if q.exists():
              print('\nEXCEPTION')
              print(q.read_text())
          PY
