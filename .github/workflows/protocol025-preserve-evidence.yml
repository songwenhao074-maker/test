name: "历史参考 / Preserve Protocol025 recovery evidence"
on:
  workflow_dispatch:
  push:
    branches: [protocol-025-revision1-gpt56-20260916]
    paths: ['.github/workflows/protocol025-preserve-evidence.yml']
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Preserve immutable chunk base
        uses: actions/download-artifact@v4
        with:
          name: protocol025-r1-chunks-base
          path: evidence/chunks
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35254809015
      - name: Preserve latest state before final guard row
        uses: actions/download-artifact@v4
        with:
          name: protocol025-r1-overlay-5520
          path: evidence/state_5520
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35254809015
      - name: Preserve fallback state
        uses: actions/download-artifact@v4
        with:
          name: protocol025-r1-state-5400
          path: evidence/state_5400
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35254809015
      - name: Verify recovery cursors and hash evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('evidence')
          manifests={}
          for label,expected in [('state_5520',5520),('state_5400',5400)]:
              m=json.loads((root/label/'resume_manifest.json').read_text())
              assert m['next_t']==expected,(label,m['next_t'])
              assert len(m['chunks'])==27 and m['chunks'][-1]['end']==5400
              manifests[label]={'next_t':m['next_t'],'registration_sha256':m['registration_sha256'],'chunks':len(m['chunks'])}
          hashes={}
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  h=hashlib.sha256()
                  with p.open('rb') as f:
                      for block in iter(lambda:f.read(4*1024*1024),b''):h.update(block)
                  hashes[str(p.relative_to(root))]={'sha256':h.hexdigest(),'bytes':p.stat().st_size}
          sources=[]
          for artifact in [10511229133,10516563749,10511498905]:
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(artifact)
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r: sources.append(json.load(r))
          payload={'kind':'evidence_preservation_only','source_run':35254809015,'source_artifacts':sources,'state_manifests':manifests,'files':hashes,'simulation_steps_run':0,'model_steps_run':0,'protocol025_audit_eligible':False}
          (root/'preservation_manifest.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps({'files':len(hashes),'simulation_steps_run':0,'model_steps_run':0,'cursors':manifests}))
          PY
      - name: Archive recovery evidence for continued review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol025-recovery-evidence-preserved-20260918
          path: evidence/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
