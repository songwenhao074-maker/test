name: Protocol-027 single D/C pilot

on:
  push:
    branches:
      - protocol-027-pilot-gpt56-20260921
    paths:
      - .github/workflows/protocol027-pilot.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: protocol027-single-pilot
  cancel-in-progress: false

jobs:
  protocol027:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
      STREAM_ROOT: artifacts/ftmoe_online/protocol_025/data_seed700
      METHOD_REG: artifacts/ftmoe_online/protocol_025/method_registration.json
      P027_REG: artifacts/ftmoe_online/protocol_027/registration.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install CPU experiment dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3 dill==0.3.8 psutil

      - name: Compile and run targeted Protocol-027 checks
        run: |
          python -m py_compile ftmoe_protocol027_normal_guard.py audit_ftmoe_protocol027.py run_ftmoe_protocol027_pilot.py finalize_ftmoe_protocol027.py
          python -m unittest -v test_ftmoe_protocol027_guard.py test_ftmoe_protocol025_model.py test_ftmoe_protocol025_session.py test_ftmoe_protocol024_v2c.py

      - name: Download preserved Protocol-025 recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: protocol025-recovery-evidence-preserved-20260918
          path: /tmp/p027_preserved
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35292728416

      - name: Verify preservation evidence and restore next_t=5520
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, shutil
          src=pathlib.Path('/tmp/p027_preserved')
          manifest=src/'preservation_manifest.json'
          if not manifest.is_file():
              hits=list(src.rglob('preservation_manifest.json'))
              if len(hits)!=1:
                  raise SystemExit('preservation_manifest.json not uniquely found')
              src=hits[0].parent
              manifest=hits[0]
          m=json.loads(manifest.read_text())
          assert m['kind']=='evidence_preservation_only'
          assert m['source_run']==35254809015
          assert m['simulation_steps_run']==0 and m['model_steps_run']==0
          assert m['state_manifests']['state_5520']['next_t']==5520
          for rel,meta in m['files'].items():
              p=src/rel
              assert p.is_file(), rel
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for block in iter(lambda:f.read(4*1024*1024),b''):
                      h.update(block)
              assert h.hexdigest()==meta['sha256'], rel
              assert p.stat().st_size==meta['bytes'], rel
          out=pathlib.Path('artifacts/ftmoe_online/protocol_025/data_seed700')
          if out.exists():
              shutil.rmtree(out)
          (out/'chunks').mkdir(parents=True)
          for p in (src/'chunks').iterdir():
              if p.is_file():
                  shutil.copy2(p,out/'chunks'/p.name)
          for p in (src/'state_5520').iterdir():
              if p.is_file():
                  shutil.copy2(p,out/p.name)
          r=json.loads((out/'resume_manifest.json').read_text())
          assert r['next_t']==5520
          assert len(r['chunks'])==27 and r['chunks'][-1]['end']==5400
          print({'restored_next_t':r['next_t'],'immutable_chunks':len(r['chunks'])})
          PY

      - name: Recover only the registered final guard interval
        run: |
          python - <<'PY'
          import psutil, runpy, sys
          if not hasattr(psutil, 'BELOW_NORMAL_PRIORITY_CLASS'):
              psutil.BELOW_NORMAL_PRIORITY_CLASS = 10
          sys.argv=[
              'maintenance/run_protocol025_segmented_recovery.py',
              '--output','artifacts/ftmoe_online/protocol_025/data_seed700',
              '--resume','--max-intervals','1'
          ]
          runpy.run_path('maintenance/run_protocol025_segmented_recovery.py',run_name='__main__')
          PY
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('artifacts/ftmoe_online/protocol_025/data_seed700')
          resume=json.loads((root/'resume_manifest.json').read_text())
          manifest=json.loads((root/'manifest.json').read_text())
          assert resume['next_t']==5521
          h=hashlib.sha256((root/'stream.npz').read_bytes()).hexdigest()
          assert h=='46b1dbdd885683bd45c146ffc3cbe68dd151bf60a10c1663eda45b68f12d7c42'
          assert manifest['stream_sha256']==h
          last=manifest['chunk_manifest'][-1]
          p=root/'chunks'/last['file']
          ch=hashlib.sha256(p.read_bytes()).hexdigest()
          assert (last['start'],last['end'])==(5400,5521)
          assert ch==last['sha256']=='fc3e9887961e6e99f29d0f386e4da9dd318367010f9028a6233599829eef4c10'
          print({'stream_sha256':h,'final_chunk_sha256':ch,'next_t':5521})
          PY

      - name: Run Protocol-027 eligibility audit and registered C/D arms
        id: execute
        run: |
          RUN_DIR="artifacts/ftmoe_online/protocol_027/runtime/run_${GITHUB_RUN_ID}"
          mkdir -p "$RUN_DIR"
          set +e
          python audit_ftmoe_protocol027.py --data-root "$STREAM_ROOT" --output-root "$RUN_DIR"
          AUDIT_RC=$?
          if [ "$AUDIT_RC" -eq 0 ]; then
            python run_ftmoe_protocol027_pilot.py               --stream "$STREAM_ROOT"               --out-root "$RUN_DIR"               --method-registration "$METHOD_REG"               --registration "$P027_REG"               --data-lock "$RUN_DIR/data_lock.json"               --eligibility "$RUN_DIR/eligibility.json"               --run-id "$GITHUB_RUN_ID"
            RUN_RC=$?
          else
            RUN_RC=99
          fi
          export RUN_DIR AUDIT_RC RUN_RC
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUN_DIR'])/'workflow_execution.json'
          p.write_text(json.dumps({
              'protocol':'027',
              'github_run_id':int(os.environ['GITHUB_RUN_ID']),
              'audit_returncode':int(os.environ['AUDIT_RC']),
              'runner_returncode':int(os.environ['RUN_RC'])
          },indent=2)+'\n')
          PY
          exit 0

      - name: Upload complete Protocol-027 evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: protocol027-single-pilot-${{ github.run_id }}
          path: artifacts/ftmoe_online/protocol_027/runtime/run_${{ github.run_id }}/
          if-no-files-found: warn
          compression-level: 3
          retention-days: 90

      - name: Build report and compact Git handoff
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python finalize_ftmoe_protocol027.py             --run-root "artifacts/ftmoe_online/protocol_027/runtime/run_${GITHUB_RUN_ID}"             --git-dest "artifacts/ftmoe_online/protocol_027/runs/run_${GITHUB_RUN_ID}"             --run-id "$GITHUB_RUN_ID"             --repository "$GITHUB_REPOSITORY"             --artifact-id "$ARTIFACT_ID"             --artifact-url "$ARTIFACT_URL"

      - name: Commit compact results and handoff
        if: always()
        run: |
          git config user.name "protocol027-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/PROTOCOL027_RESULTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md artifacts/ftmoe_online/protocol_027/runs/
          git commit -m "results: record Protocol027 single D/C pilot run ${GITHUB_RUN_ID}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Final Protocol-027 completion gate
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('artifacts/ftmoe_online/protocol_027/runs')/('run_'+os.environ['GITHUB_RUN_ID'])/'status.json'
          if not p.is_file():
              raise SystemExit('Protocol027 compact status.json missing')
          s=json.loads(p.read_text())
          print(json.dumps(s,indent=2))
          if not s.get('completed'):
              raise SystemExit('Protocol027 ended with a documented blocker')
          PY
