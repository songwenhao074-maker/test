name: Protocol-027 single D/C pilot
# Launch revision002 D/C pilot 2026-09-22

on:
  push:
    branches: [protocol-027-pilot-gpt56-20260921]
    paths:
      - .github/workflows/protocol027-pilot.yml
  workflow_dispatch:
    inputs:
      run_models:
        description: 'Run the registered C_fixed5/D_dynamic pilot after the audit'
        type: boolean
        required: true
        default: false
      frozen_data_run_id:
        description: 'Reuse a complete protocol027-frozen-data artifact from this run; blank prepares it once'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: protocol027-single-pilot
  cancel-in-progress: false

jobs:
  protocol027:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "3"
      MKL_NUM_THREADS: "3"
      OPENBLAS_NUM_THREADS: "3"
      STREAM_ROOT: artifacts/ftmoe_online/protocol_025/data_seed700
      METHOD_REG: artifacts/ftmoe_online/protocol_025/method_registration.json
      RUN_MODELS: ${{ github.event_name == 'push' || inputs.run_models || false }}
      FROZEN_RUN_ID: ${{ inputs.frozen_data_run_id || '' }}
      P027_REG: artifacts/ftmoe_online/protocol_027/registration.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip

      - name: Install CPU experiment dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3 dill==0.3.8 psutil

      - name: Compile and run targeted Protocol-027 checks
        run: |
          python -m py_compile ftmoe_protocol027_normal_guard.py audit_ftmoe_protocol027.py run_ftmoe_protocol027_pilot.py finalize_ftmoe_protocol027.py ftmoe_protocol027_data.py prepare_ftmoe_protocol027_revision002.py
          python -m unittest -v test_ftmoe_protocol027_features.py test_ftmoe_protocol027_handoff.py test_ftmoe_protocol027_recovery.py test_ftmoe_protocol027_data.py test_ftmoe_protocol027_guard.py test_ftmoe_protocol025_model.py test_ftmoe_protocol025_session.py test_ftmoe_protocol024_v2c.py

      - name: Restore a complete frozen dataset without simulation
        if: env.FROZEN_RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: protocol027-frozen-data-${{ inputs.frozen_data_run_id }}
          path: artifacts/ftmoe_online/protocol_025/data_seed700
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.frozen_data_run_id }}

      - name: Verify downloaded frozen dataset
        if: env.FROZEN_RUN_ID != ''
        run: python ftmoe_protocol027_data.py --data-root "$STREAM_ROOT" --verify-only

      - name: Download preserved Protocol-025 recovery evidence
        if: env.FROZEN_RUN_ID == ''
        uses: actions/download-artifact@v4
        with:
          name: protocol025-recovery-evidence-preserved-20260918
          path: /tmp/p027_preserved
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35292728416

      - name: Download the selected existing revision002 physical stream
        if: env.FROZEN_RUN_ID == ''
        uses: actions/download-artifact@v4
        with:
          name: protocol027-restored-stream-35604239834
          path: /tmp/p027_candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35604239834

      - name: Assemble revision002 without running the simulator
        if: env.FROZEN_RUN_ID == ''
        run: |
          python prepare_ftmoe_protocol027_revision002.py \
            --preserved /tmp/p027_preserved --candidate /tmp/p027_candidate --output "$STREAM_ROOT"

      - name: Run Protocol-027 eligibility audit
        run: |
          RUN_DIR="artifacts/ftmoe_online/protocol_027/runtime/run_${GITHUB_RUN_ID}"
          mkdir -p "$RUN_DIR"
          python audit_ftmoe_protocol027.py --data-root "$STREAM_ROOT" --output-root "$RUN_DIR"

      - name: Freeze and stage the complete audited dataset
        run: |
          python ftmoe_protocol027_data.py --data-root "$STREAM_ROOT" \
            --eligibility "artifacts/ftmoe_online/protocol_027/runtime/run_${GITHUB_RUN_ID}/eligibility.json" \
            --export-dir /tmp/protocol027-frozen-data

      - name: Archive complete dataset before either comparator starts
        id: frozen
        uses: actions/upload-artifact@v4
        with:
          name: protocol027-frozen-data-${{ github.run_id }}
          path: /tmp/protocol027-frozen-data/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

      - name: Record frozen data archive identity
        env:
          FROZEN_ARTIFACT_ID: ${{ steps.frozen.outputs.artifact-id }}
          FROZEN_ARTIFACT_URL: ${{ steps.frozen.outputs.artifact-url }}
          FROZEN_ARTIFACT_DIGEST: ${{ steps.frozen.outputs.artifact-digest }}
        run: |
          python - <<'PYTHON'
          import json, os, pathlib
          from ftmoe_protocol027_data import REVISION_ID, sha
          root=pathlib.Path('artifacts/ftmoe_online/protocol_027/runtime')/('run_'+os.environ['GITHUB_RUN_ID'])
          assert os.environ['FROZEN_ARTIFACT_ID'] and os.environ['FROZEN_ARTIFACT_DIGEST']
          receipt={'data_revision':REVISION_ID,'complete_snapshot_uploaded':True,
            'github_run_id':os.environ['GITHUB_RUN_ID'],'artifact_id':os.environ['FROZEN_ARTIFACT_ID'],
            'artifact_url':os.environ['FROZEN_ARTIFACT_URL'],'artifact_digest':os.environ['FROZEN_ARTIFACT_DIGEST'],
            'artifact_name':'protocol027-frozen-data-'+os.environ['GITHUB_RUN_ID'],
            'frozen_manifest_sha256':sha(pathlib.Path(os.environ['STREAM_ROOT'])/'frozen_data_manifest.json'),
            'restored_from_run':os.environ.get('FROZEN_RUN_ID') or None,'retention_days':90}
          (root/'frozen_data_archive.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PYTHON

      - name: Run only the registered C/D arms on the same archived dataset
        if: env.RUN_MODELS == 'true'
        run: |
          RUN_DIR="artifacts/ftmoe_online/protocol_027/runtime/run_${GITHUB_RUN_ID}"
          python run_ftmoe_protocol027_pilot.py \
            --stream "$STREAM_ROOT" --out-root "$RUN_DIR" \
            --method-registration "$METHOD_REG" --registration "$P027_REG" \
            --data-lock "$RUN_DIR/data_lock.json" --eligibility "$RUN_DIR/eligibility.json" \
            --run-id "$GITHUB_RUN_ID"

      - name: Persist status even if the runner never started
        if: always()
        run: |
          python finalize_ftmoe_protocol027.py --status-only \
            --run-root "artifacts/ftmoe_online/protocol_027/runtime/run_${GITHUB_RUN_ID}" \
            --git-dest "artifacts/ftmoe_online/protocol_027/runs/run_${GITHUB_RUN_ID}" \
            --run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY"

      - name: Preserve restored physical stream independently of model eligibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol027-restored-stream-${{ github.run_id }}
          path: |
            artifacts/ftmoe_online/protocol_025/data_seed700/stream.npz
            artifacts/ftmoe_online/protocol_025/data_seed700/common_observable_features.npz
            artifacts/ftmoe_online/protocol_025/data_seed700/manifest.json
            artifacts/ftmoe_online/protocol_025/data_seed700/events.json
            artifacts/ftmoe_online/protocol_025/data_seed700/resume_manifest.json
            artifacts/ftmoe_online/protocol_025/data_seed700/data_audit.json
            artifacts/ftmoe_online/protocol_025/data_seed700/chunks/chunk_005400_005521.npz
          if-no-files-found: warn
          compression-level: 1
          retention-days: 90

      - name: Upload complete Protocol-027 evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: protocol027-single-pilot-${{ github.run_id }}
          path: artifacts/ftmoe_online/protocol_027/runtime/run_${{ github.run_id }}/
          if-no-files-found: warn
          compression-level: 3
          retention-days: 90

      - name: Build report and compact Git handoff
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python finalize_ftmoe_protocol027.py             --run-root "artifacts/ftmoe_online/protocol_027/runtime/run_${GITHUB_RUN_ID}"             --git-dest "artifacts/ftmoe_online/protocol_027/runs/run_${GITHUB_RUN_ID}"             --run-id "$GITHUB_RUN_ID"             --repository "$GITHUB_REPOSITORY"             --artifact-id "$ARTIFACT_ID"             --artifact-url "$ARTIFACT_URL"

      - name: Commit compact results and handoff
        if: always()
        run: |
          git config user.name "protocol027-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/PROTOCOL027_RESULTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md artifacts/ftmoe_online/protocol_027/runs/
          git commit -m "results: record Protocol027 single D/C pilot run ${GITHUB_RUN_ID}" || true
          git fetch origin "$GITHUB_REF_NAME"
          git rebase FETCH_HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Final Protocol-027 completion gate
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('artifacts/ftmoe_online/protocol_027/runs')/('run_'+os.environ['GITHUB_RUN_ID'])/'status.json'
          if not p.is_file():
              raise SystemExit('Protocol027 compact status.json missing')
          s=json.loads(p.read_text())
          print(json.dumps(s,indent=2))
          if os.environ['RUN_MODELS'] != 'true' and s.get('state') == 'ready_for_two_arm_pilot':
              print('Data audit passed and complete frozen data archived; C/D training was not requested.')
          elif not s.get('completed'):
              raise SystemExit('Protocol027 ended with a documented blocker')
          PY
