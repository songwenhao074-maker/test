name: Protocol039 engineering preflight retry once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol039-retry-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[p039-retry-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTION_REF: codex/protocol-039-d-vs-c-sleep-wake-20261002
      EXPECTED_SHA: d6c961d4e0c50ef935a6a0ea0d8274995ce96d45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify repaired frozen branch and no science evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXECUTION_REF" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git show FETCH_HEAD:artifacts/ftmoe_online/protocol_039/plan.json | sha256sum | awk '{print $1}')" = "2182aa9c08a2067ea8abb89b70555a8174fc9a2809d0655c59effa4174cd9811"
          ACTIVE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/protocol039-d-vs-c-sleep-wake.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')"
          test "$ACTIVE" = "0"
          RAW="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired==false and (.name|startswith("protocol039-raw-")))] | length')"
          test "$RAW" = "0" || { echo "scientific raw artifact exists; refusing retry"; exit 1; }
      - name: Dispatch repaired formal Protocol039 once
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/protocol039-d-vs-c-sleep-wake.yml/dispatches"             -F ref=main             -F "inputs[execution_ref]=$EXECUTION_REF"             -F "inputs[expected_execution_sha]=$EXPECTED_SHA"
      - name: Query without retry
        shell: bash
        run: |
          sleep 5
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/protocol039-d-vs-c-sleep-wake.yml/runs?per_page=5"             --jq '.workflow_runs[] | {id,status,conclusion,created_at,html_url}'
