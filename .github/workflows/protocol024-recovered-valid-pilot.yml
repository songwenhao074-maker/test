name: "历史参考 / Protocol-024 recovered valid development pilot"

on:
  workflow_dispatch:
  push:
    branches: [protocol-024-next-round-gpt56]
    paths:
      - '.github/workflows/protocol024-recovered-valid-pilot.yml'

permissions:
  contents: read
  actions: read

jobs:
  recovered-valid-development-pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      ROOT_OUT: artifacts/ftmoe_online/protocol_024/next_round_v1
      SOURCE_FINALIZER_RUN_ID: '34953715809'
      SOURCE_ARTIFACT: 'protocol024-next-round-v1-finalized-generation'
      EXPECTED_STREAM_SHA: '468725ff2f164bee89017bfa329d63e20566659a42d2a0492e977e744c7ae946'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install online dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3
      - name: Wait for immutable-stream finalizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; run=os.environ['SOURCE_FINALIZER_RUN_ID']
          token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          url=f'https://api.github.com/repos/{repo}/actions/runs/{run}'
          for _ in range(90):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r: payload=json.load(r)
              print(json.dumps({'status':payload['status'],'conclusion':payload.get('conclusion')}),flush=True)
              if payload['status']=='completed':
                  if payload.get('conclusion')!='success': raise SystemExit('SOURCE_FINALIZER_FAILED')
                  break
              time.sleep(20)
          else: raise SystemExit('SOURCE_FINALIZER_TIMEOUT')
          PY
      - name: Download finalized immutable response-law stream
        uses: actions/download-artifact@v4
        with:
          name: protocol024-next-round-v1-finalized-generation
          path: /tmp/p24-generation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34953715809
      - name: Install immutable recovered data package
        run: |
          test -f /tmp/p24-generation/stream.npz
          test -f /tmp/p24-generation/manifest.json
          test -f /tmp/p24-generation/audit.json
          rm -rf "$ROOT_OUT/data" "$ROOT_OUT/probes" "$ROOT_OUT/budget" "$ROOT_OUT/runs"
          rm -f "$ROOT_OUT/comparison.json" "$ROOT_OUT/status.json" "$ROOT_OUT/lifecycle_calibration.json" "$ROOT_OUT/anchor_manifest.json"
          mkdir -p "$ROOT_OUT/data"
          cp -a /tmp/p24-generation/. "$ROOT_OUT/data/"
      - name: Verify stream bytes, recovered provenance, protocol code and anchor target
        run: |
          python -m unittest -v test_ftmoe_protocol024_anchor.py test_ftmoe_protocol024_response_laws.py
          python -m py_compile ftmoe_protocol024_anchor.py probe_ftmoe_protocol024_learnability.py run_ftmoe_protocol024_budget.py calibrate_ftmoe_protocol024_lifecycle.py run_ftmoe_protocol024_pilot.py
          python - <<'PY'
          import hashlib, json, numpy as np
          from pathlib import Path
          from ftmoe_protocol024_anchor import load_protocol024_raw_next_anchor, anchor_metadata
          root=Path('artifacts/ftmoe_online/protocol_024/next_round_v1')
          data=root/'data'; m=json.loads((data/'manifest.json').read_text()); a=json.loads((data/'audit.json').read_text())
          h=hashlib.sha256((data/'stream.npz').read_bytes()).hexdigest()
          assert h=='468725ff2f164bee89017bfa329d63e20566659a42d2a0492e977e744c7ae946'
          assert m['steps']==4980 and m['guard_rows']==1 and m['seed']==700
          assert m['recovery_provenance']['finalization_only'] is True and m['recovery_provenance']['simulator_rerun'] is False
          assert a['direct_label_assignment_from_response_law'] is False
          with np.load(data/'stream.npz') as d:
              ratio=d['overload_ratio']; expected=np.where((ratio>1.0).any(-1),ratio.argmax(-1)+1,0)
              assert np.array_equal(expected,d['raw_labels']) and d['raw_labels'].shape==(4981,16)
              assert not set(m['audit_only_npz_keys']) & set(m['model_input_keys'])
          anchor=load_protocol024_raw_next_anchor(); am=anchor_metadata(anchor)
          assert am['legacy_stored_labels_used'] is False and am['new_response_law_stream_used'] is False
          assert am['future_row_offset']==1 and am['anchor_samples']>0
          (root/'anchor_manifest.json').write_text(json.dumps(am,indent=2,allow_nan=False)+'\n')
          print(json.dumps({'stream_sha256':h,'recovered_finalization':True,'anchor_samples':am['anchor_samples']}))
          PY
      - name: Run gap-correct raw-history and frozen-z learnability probe
        run: python probe_ftmoe_protocol024_learnability.py --stream "$ROOT_OUT/data" --out "$ROOT_OUT/probes/learnability.json"
      - name: Enforce preregistered learnability gate
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/ftmoe_online/protocol_024/next_round_v1/probes/learnability.json'))
          assert p['actual_isolation_gap_intervals']>=13 and p['no_history_or_future_target_overlap'] is True
          print(json.dumps({'raw_history_learnable':p['raw_history_learnable'],'z_retains_history_signal':p['z_retains_history_signal'],'history_ap':p['methods']['raw_history_12x7_logistic']['ap'],'z_ap':p['methods']['frozen_z_64d_logistic']['ap'],'prevalence':p['validation_prevalence'],'proceed':p['proceed_to_budget_and_pilot']}))
          if not p['raw_history_learnable']: raise SystemExit('RAW_HISTORY_UNLEARNABLE')
          if not p['z_retains_history_signal']: raise SystemExit('FROZEN_Z_LOSES_HISTORY_SIGNAL')
          PY
      - name: Run bounded fixed-C budget comparison
        run: python run_ftmoe_protocol024_budget.py --stream "$ROOT_OUT/data" --out "$ROOT_OUT/budget/comparison.json"
      - name: Freeze numeric lifecycle threshold before pilot
        run: |
          python calibrate_ftmoe_protocol024_lifecycle.py --stream "$ROOT_OUT/data" --budget "$ROOT_OUT/budget/comparison.json" --lifecycle "$ROOT_OUT/lifecycle_config.json" --out "$ROOT_OUT/lifecycle_calibration.json"
          python - <<'PY'
          import json
          p=json.load(open('artifacts/ftmoe_online/protocol_024/next_round_v1/lifecycle_config.json'))
          c=json.load(open('artifacts/ftmoe_online/protocol_024/next_round_v1/lifecycle_calibration.json'))
          assert p['fixed_loss_threshold'] is not None and c['fixed_loss_threshold']==p['fixed_loss_threshold']
          assert c['positive_host_steps']>0 and c['normal_host_steps']>0 and c['D_C_performance_not_read'] is True
          print(json.dumps({'fixed_loss_threshold':p['fixed_loss_threshold'],'positive_host_steps':c['positive_host_steps'],'normal_host_steps':c['normal_host_steps']}))
          PY
      - name: Run lifecycle-on A C D seed700 development pilot
        run: python run_ftmoe_protocol024_pilot.py --stream "$ROOT_OUT/data" --budget "$ROOT_OUT/budget/comparison.json" --lifecycle "$ROOT_OUT/lifecycle_config.json" --out-root "$ROOT_OUT/runs/seed700_rawnext_lifecycle_v3_recovered" --comparison "$ROOT_OUT/comparison.json"
      - name: Write machine-readable status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/ftmoe_online/protocol_024/next_round_v1')
          def read(rel):
              p=root/rel
              return json.loads(p.read_text()) if p.is_file() else None
          learn=read('probes/learnability.json'); budget=read('budget/comparison.json'); calibration=read('lifecycle_calibration.json'); comp=read('comparison.json'); manifest=read('data/manifest.json')
          status={'protocol':'024','round':'next_round_v1','confirmation_run':False,'engineering_passed':True,'new_stream_generated':manifest is not None,'stream_generation_source_run_id':34918496058,'stream_finalizer_run_id':34953715809,'stream_recovered_without_simulator_rerun':True,'stream_sha256':None if manifest is None else manifest.get('stream_sha256'),'learnability_completed':learn is not None,'learnability_passed':None if learn is None else bool(learn.get('proceed_to_budget_and_pilot')),'budget_comparison_completed':budget is not None,'selected_update_every':None if budget is None else budget.get('selected_update_every'),'lifecycle_calibration_completed':calibration is not None,'fixed_loss_threshold':None if calibration is None else calibration.get('fixed_loss_threshold'),'lifecycle_on_run_completed':comp is not None,'lifecycle_exercised':None if comp is None else bool(comp.get('lifecycle',{}).get('lifecycle_exercised')),'development_signal':None if comp is None else comp.get('development_signal'),'target':'raw_next_fault','seeds':{'replay':700,'model':1,'confirmation_used':[]}}
          if comp is not None and not status['lifecycle_exercised']: status['lifecycle_not_exercised_reason']=comp.get('lifecycle',{}).get('lifecycle_not_exercised_reason')
          (root/'status.json').write_text(json.dumps(status,indent=2,allow_nan=False)+'\n')
          print(json.dumps(status,indent=2,allow_nan=False))
          PY
      - name: Upload recovered valid development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol024-next-round-v1-recovered-valid-development
          path: |
            artifacts/ftmoe_online/protocol_024/next_round_v1/data
            artifacts/ftmoe_online/protocol_024/next_round_v1/probes
            artifacts/ftmoe_online/protocol_024/next_round_v1/budget
            artifacts/ftmoe_online/protocol_024/next_round_v1/runs
            artifacts/ftmoe_online/protocol_024/next_round_v1/comparison.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/status.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/anchor_manifest.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/lifecycle_calibration.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/registration.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/response_law_config.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/lifecycle_config.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/budget_policy.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/integrity_gates.json
            artifacts/ftmoe_online/protocol_024/next_round_v1/problem_log.json
          if-no-files-found: warn
          compression-level: 6
