name: Protocol037 dispatch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol037-dispatch-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[p037-dispatch-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTION_REF: codex/protocol-037-single-dynamic-birth-20261001
      EXPECTED_SHA: 57346b6f0357a38f6f2fe6839da07a8a4cf53be9
      PLAN_SHA: 01240a944bb654d529577b397602cf67c24c2245c6fbe909564b47da2726012a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify frozen target and dispatch exactly once
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXECUTION_REF" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git show FETCH_HEAD:artifacts/ftmoe_online/protocol_037/plan.json > /tmp/p037-plan.json
          test "$(sha256sum /tmp/p037-plan.json | awk '{print $1}')" = "$PLAN_SHA"
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/protocol037-single-dynamic-birth.yml/runs?event=workflow_dispatch" --jq '.total_count')"
          if [ "$COUNT" != "0" ]; then
            echo "Protocol037 formal workflow already has a workflow_dispatch run; not dispatching again."
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/protocol037-single-dynamic-birth.yml/dispatches" \
            -f ref=main \
            -f "inputs[execution_ref]=$EXECUTION_REF" \
            -f "inputs[expected_execution_sha]=$EXPECTED_SHA" \
            -f "inputs[resume_run_id]="
