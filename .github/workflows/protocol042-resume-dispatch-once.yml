name: Protocol042 revision2 resume dispatch once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/protocol042-resume-dispatch-once.yml']
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[p042r2-resume-dispatch]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch frozen Protocol042 from repaired U boundary
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run protocol042-windowed-utility.yml             --repo "$GITHUB_REPOSITORY"             -f execution_ref="codex/protocol-042-windowed-utility-20261003"             -f expected_execution_sha="da5eaa7e71f44497ede538c884e7ca688e6afbf4"             -f resume_artifact_id="11275945586"             -f resume_artifact_digest="sha256:a022dbc5570b355672b1a8f6bd7016fe109bffdfd59dc0214db014fe4b1653b5"             -f resume_arm="R_win128"
          sleep 3
          gh run list --repo "$GITHUB_REPOSITORY" --workflow protocol042-windowed-utility.yml --limit 3
