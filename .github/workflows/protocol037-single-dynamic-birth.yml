name: Protocol-037 single dynamic birth

on:
  workflow_dispatch:
    inputs:
      execution_ref:
        required: true
        default: codex/protocol-037-single-dynamic-birth-20261001
      expected_execution_sha:
        required: true
        default: 57346b6f0357a38f6f2fe6839da07a8a4cf53be9
      resume_run_id:
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: protocol037-single-dynamic-birth
  cancel-in-progress: false

jobs:
  protocol037:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      EXECUTION_REF: ${{ inputs.execution_ref }}
      EXPECTED_EXECUTION_SHA: ${{ inputs.expected_execution_sha }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      PLAN_SHA: 01240a944bb654d529577b397602cf67c24c2245c6fbe909564b47da2726012a
      SOURCE_ARTIFACT_ID: '11147931152'
      SOURCE_ZIP_SHA: 040bacac8f23659f56599b71d6d6706b62a544e44161c7c42fb5af73650f56c0
      SCI_ROOT: artifacts/ftmoe_online/protocol_037/runtime/run_${{ github.run_id }}
      COMPACT_ROOT: artifacts/ftmoe_online/protocol_037/runs/run_${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '1'

    steps:
      - name: Checkout exact Protocol037 execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_ref }}
          fetch-depth: 0

      - name: Enforce frozen checkout and registration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EXECUTION_SHA"
          test "$(sha256sum artifacts/ftmoe_online/protocol_037/plan.json | awk '{print $1}')" = "$PLAN_SHA"
          python maintenance/validate_protocol037_plan.py
          python -m py_compile run_ftmoe_protocol037.py analyze_ftmoe_protocol037.py maintenance/protocol037_finalize.py
          git diff --exit-code 876172e1a16ebcaa321f3ca713bb06ee6ba31b87 -- run_ftmoe_protocol036.py analyze_ftmoe_protocol036.py protocol035_common.py run_ftmoe_protocol035.py
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/protocol037-single-dynamic-birth.yml > /tmp/protocol037-workflow.yml

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install registered CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1
          python -m pip install numpy==1.24.4 psutil==5.9.8
          mkdir -p "$SCI_ROOT"
          python -m pip freeze > "$SCI_ROOT/pip_freeze.txt"

      - name: Download and verify exact Protocol036 terminal artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p036_source /tmp/p036.zip
          mkdir -p /tmp/p036_source
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o /tmp/p036.zip
          test "$(sha256sum /tmp/p036.zip | awk '{print $1}')" = "$SOURCE_ZIP_SHA"
          unzip -q /tmp/p036.zip -d /tmp/p036_source
          P036_ROOT="$(find /tmp/p036_source -type d -path '*/runtime/run_36831958978' | head -n 1)"
          test -n "$P036_ROOT"
          echo "P036_ROOT=$P036_ROOT" >> "$GITHUB_ENV"

      - name: Restore interrupted Protocol037 state only for exact resume
        if: ${{ inputs.resume_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ART_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "protocol037-terminal-'"$RESUME_RUN_ID"'") | .id' | head -n1)"
          test -n "$ART_ID"
          rm -rf /tmp/p037_resume /tmp/p037_resume.zip
          mkdir -p /tmp/p037_resume
          curl -fsSL -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" \
            -o /tmp/p037_resume.zip
          unzip -q /tmp/p037_resume.zip -d /tmp/p037_resume
          mkdir -p "$SCI_ROOT"
          cp -a /tmp/p037_resume/. "$SCI_ROOT"/
          test -f "$SCI_ROOT/budget_ledger.json"
          test -f "$SCI_ROOT/checkpoints/latest_checkpoint.json"
          CP_FILE="$(python - "$SCI_ROOT/checkpoints/latest_checkpoint.json" <<'PY'
          import json,sys
          print(json.load(open(sys.argv[1]))['file'])
          PY
          )"
          test -f "$SCI_ROOT/checkpoints/$CP_FILE"
          echo "RESUME_CHECKPOINT=$SCI_ROOT/checkpoints/$CP_FILE" >> "$GITHUB_ENV"

      - name: Run bounded real-prefix and synthetic exact-resume fixtures
        if: ${{ inputs.resume_run_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p037_fixture
          mkdir -p /tmp/p037_fixture
          python run_ftmoe_protocol037.py fixture \
            --source-root "$P036_ROOT" \
            --out-dir /tmp/p037_fixture \
            --report "$SCI_ROOT/fixture_report.json"

      - name: Reuse original successful fixture on resume
        if: ${{ inputs.resume_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SCI_ROOT/fixture_report.json"
          python - "$SCI_ROOT/fixture_report.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['passed'] is True
          assert d['real_joint_prefix_executions']==2
          assert d['max_real_prefix_steps']==256
          PY

      - name: Record fresh science provenance
        shell: bash
        run: |
          set -euo pipefail
          python maintenance/protocol037_finalize.py provenance \
            --out "$SCI_ROOT/implementation_manifest.json" \
            --run-id "$GITHUB_RUN_ID" \
            --checkout-sha "$(git rev-parse HEAD)" \
            --workflow /tmp/protocol037-workflow.yml \
            --run-script run_ftmoe_protocol037.py \
            --analysis-script analyze_ftmoe_protocol037.py \
            --finalize-script maintenance/protocol037_finalize.py \
            --plan artifacts/ftmoe_online/protocol_037/plan.json \
            --validator maintenance/validate_protocol037_plan.py \
            --pip-freeze "$SCI_ROOT/pip_freeze.txt"

      - name: Execute exactly the two registered scientific sequences
        id: science
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RESUME_RUN_ID" ]; then
            python run_ftmoe_protocol037.py science \
              --source-root "$P036_ROOT" \
              --out-dir "$SCI_ROOT" \
              --run-id "$GITHUB_RUN_ID" \
              --fixture-report "$SCI_ROOT/fixture_report.json" \
              --resume-checkpoint "$RESUME_CHECKPOINT"
          else
            python run_ftmoe_protocol037.py science \
              --source-root "$P036_ROOT" \
              --out-dir "$SCI_ROOT" \
              --run-id "$GITHUB_RUN_ID" \
              --fixture-report "$SCI_ROOT/fixture_report.json"
          fi

      - name: Freeze raw scientific hashes before analysis
        if: ${{ steps.science.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python maintenance/protocol037_finalize.py manifest \
            --root "$SCI_ROOT" \
            --out "$SCI_ROOT/raw_scientific_manifest.json" \
            --exclude analysis

      - name: Analyze only frozen registered comparisons
        id: analysis
        if: ${{ steps.science.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SCI_ROOT/analysis"
          python analyze_ftmoe_protocol037.py \
            --run-root "$SCI_ROOT" \
            --source-manifest "$P036_ROOT/inputs/seed3601/manifest.json" \
            --fixture "$SCI_ROOT/fixture_report.json" \
            --provenance "$SCI_ROOT/implementation_manifest.json" \
            --output-dir "$SCI_ROOT/analysis" \
            --docs-output docs/PROTOCOL037_RESULTS.md \
            --run-id "$GITHUB_RUN_ID"
          cp "$SCI_ROOT/analysis/comparison.json" "$SCI_ROOT/comparison.json"
          cp "$SCI_ROOT/analysis/cost_profile.json" "$SCI_ROOT/cost_profile.json"
          cp "$SCI_ROOT/analysis/status.json" "$SCI_ROOT/status.json"

      - name: Materialize terminal file manifest
        if: ${{ steps.science.outcome == 'success' && steps.analysis.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python maintenance/protocol037_finalize.py manifest \
            --root "$SCI_ROOT" \
            --out "$SCI_ROOT/terminal_file_manifest.json"

      - name: Upload complete Protocol037 terminal artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol037-terminal-${{ github.run_id }}
          path: ${{ env.SCI_ROOT }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Record artifact index and compact evidence
        if: ${{ steps.science.outcome == 'success' && steps.analysis.outcome == 'success' }}
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$SCI_ROOT/artifact_api.json"
          python maintenance/protocol037_finalize.py artifact-index \
            --artifact-info "$SCI_ROOT/artifact_api.json" \
            --raw-manifest "$SCI_ROOT/terminal_file_manifest.json" \
            --out "$SCI_ROOT/artifact_index.json" \
            --run-id "$GITHUB_RUN_ID"
          python maintenance/protocol037_finalize.py compact --src "$SCI_ROOT" --dst "$COMPACT_ROOT"

      - name: Update frozen handoff pointers
        if: ${{ steps.science.outcome == 'success' && steps.analysis.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$SCI_ROOT/status.json" "$GITHUB_RUN_ID" <<'PY'
          import json,sys,pathlib
          s=json.load(open(sys.argv[1])); rid=sys.argv[2]; label=s['result_label']
          pathlib.Path('AGENTS.md').write_text(
              f"# Active Experiment Directive\n\nProtocol-037 completed in run {rid}. Result label: {label}. Historical033-037 scientific budgets are closed and immutable.\n\nPrimary handoff: docs/PROTOCOL037_RESULTS.md. Compact evidence: artifacts/ftmoe_online/protocol_037/runs/run_{rid}/.\n\nDo not rerun Protocol-037 to change the trigger outcome or publication state. No sleep/wake/delete or next-protocol training is authorized automatically.\n",encoding='utf8')
          pathlib.Path('NEXT_EXPERIMENT_LATEST.md').write_text(
              f"# 下一实验交接\n\nProtocol-037 已完成，run {rid}，结果标签 **{label}**。\n\n先读取 docs/PROTOCOL037_RESULTS.md 与 artifacts/ftmoe_online/protocol_037/runs/run_{rid}/。037 的两条训练序列预算已关闭，不得调阈值、重跑触发器或自动进入休眠/唤醒/删除。下一步必须由新的分析与预登记指示决定。\n",encoding='utf8')
          pathlib.Path('PROJECT_CONTEXT_LATEST.md').write_text(
              f"# Project Context Latest\n\nCurrent terminal experiment: Protocol-037, run {rid}. Result label: **{label}**. Birth occurred: {s['birth_occurred']}. F extra capability: {s['F_extra_capability_signal']}. D birth extra capability: {s['D_birth_extra_capability_signal']}. Dynamic birth incremental signal: {s['dynamic_birth_incremental_signal']}.\n\nRead docs/PROTOCOL037_RESULTS.md and artifacts/ftmoe_online/protocol_037/runs/run_{rid}/. No automatic follow-up experiment is authorized.\n",encoding='utf8')
          PY

      - name: Commit compact results to execution branch
        id: result_commit
        if: ${{ steps.science.outcome == 'success' && steps.analysis.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROTOCOL037_RESULTS.md "$COMPACT_ROOT" AGENTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md
          git commit -m "results: Protocol037 single dynamic birth [skip ci]"
          git push origin HEAD:"$EXECUTION_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish compact results to latest main using clean clone
        id: publish
        if: ${{ steps.science.outcome == 'success' && steps.analysis.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED=false
          for TRY in 1 2 3; do
            rm -rf /tmp/p037_publish
            gh repo clone "$GITHUB_REPOSITORY" /tmp/p037_publish -- --depth=1 --branch main
            PUB=/tmp/p037_publish
            mkdir -p "$PUB/docs" "$PUB/artifacts/ftmoe_online/protocol_037/runs"
            cp docs/PROTOCOL037_RESULTS.md "$PUB/docs/PROTOCOL037_RESULTS.md"
            rm -rf "$PUB/$COMPACT_ROOT"
            mkdir -p "$(dirname "$PUB/$COMPACT_ROOT")"
            cp -a "$COMPACT_ROOT" "$PUB/$COMPACT_ROOT"
            cp AGENTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md "$PUB/"
            python "$GITHUB_WORKSPACE/maintenance/protocol037_finalize.py" status \
              --status "$PUB/$COMPACT_ROOT/status.json" \
              --value published_main \
              --compact-root "$PUB/$COMPACT_ROOT"
            (
              cd "$PUB"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add docs/PROTOCOL037_RESULTS.md "$COMPACT_ROOT" AGENTS.md NEXT_EXPERIMENT_LATEST.md PROJECT_CONTEXT_LATEST.md
              git commit -m "results: publish Protocol037 run $GITHUB_RUN_ID [skip ci]"
              git push origin HEAD:main
            ) && { PUBLISHED=true; break; }
          done
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHED" != true ]; then echo "publication_pending_after_three_nonforce_retries"; fi

      - name: Record published status back on execution branch
        if: ${{ steps.science.outcome == 'success' && steps.analysis.outcome == 'success' && steps.publish.outputs.published == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python maintenance/protocol037_finalize.py status \
            --status "$COMPACT_ROOT/status.json" \
            --value published_main \
            --compact-root "$COMPACT_ROOT"
          git add "$COMPACT_ROOT/status.json" "$COMPACT_ROOT/compact_manifest.json"
          git commit -m "results: mark Protocol037 main publication complete [skip ci]"
          git push origin HEAD:"$EXECUTION_REF"

      - name: Fail only for scientific or analysis execution failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.science.outcome }}" != "success" ]; then
            echo "Protocol037 scientific execution interrupted; exact checkpoint resume only."
            exit 1
          fi
          if [ "${{ steps.analysis.outcome }}" != "success" ]; then
            echo "Protocol037 frozen analysis failed after science; do not rerun science."
            exit 1
          fi
          echo "Protocol037 registered science and analysis completed."
