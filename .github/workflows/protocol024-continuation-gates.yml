name: Protocol-024 continuation integrity gates

on:
  push:
    branches: [protocol-024-continuation-gpt56]
    paths:
      - 'ftmoe_protocol024_session.py'
      - 'ftmoe_protocol024_dynamic_residual.py'
      - 'test_ftmoe_protocol024_gates.py'
      - 'run_ftmoe_protocol024_session_smoke.py'
      - '.github/workflows/protocol024-continuation-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity-gates:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'
      - name: Install online dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3
      - name: Run Protocol-024 integrity gates
        run: |
          python -m unittest -v test_ftmoe_protocol024_gates.py
      - name: Run integrated strict-prequential C/D session smoke
        run: |
          python run_ftmoe_protocol024_session_smoke.py \
            --intervals 24 \
            --out artifacts/ftmoe_online/protocol_024/continuation_20260914/integrated_session_smoke.json
      - name: Upload integrated session result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol024-integrated-session-smoke
          path: artifacts/ftmoe_online/protocol_024/continuation_20260914/integrated_session_smoke.json
          if-no-files-found: warn
