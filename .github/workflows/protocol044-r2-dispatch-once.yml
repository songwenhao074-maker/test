name: Protocol044 r2 dispatch once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol044-r2-dispatch-once.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[p044r2-dispatch]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen Protocol044 r2 durable recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run protocol044-revision2-durable-recovery.yml             --repo "$GITHUB_REPOSITORY" --ref main             -f execution_sha=b1f501d9db6cbd3bd5e7968c4ed43e45a34aae78             -f gate_artifact_id=11322806544             -f gate_digest=sha256:c2888a4f7f7168bf77d3a523694b1eb67ba7b692713510c5f89f2d792db9159a
