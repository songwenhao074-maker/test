name: Protocol044 r2 dispatch once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol044-r2-dispatch-once.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[p044r2-dispatch]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen Protocol044 r2 durable recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run protocol044-revision2-durable-recovery.yml             --repo "$GITHUB_REPOSITORY" --ref main             -f execution_sha=57ecaadb22dac117f5004c782ad5a27a03d84efc             -f gate_artifact_id=11323195440             -f gate_digest=sha256:c4af8bc5504c7db65822539134a0f31a580c2b99f0c4746d5912b9fc6dccdeed
