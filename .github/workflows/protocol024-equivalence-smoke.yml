name: "历史参考 / Protocol-024 residual equivalence smoke"

on:
  push:
    branches: [protocol-024]
    paths:
      - 'run_ftmoe_protocol024_equivalence_smoke.py'
      - 'ftmoe_protocol024_dynamic_residual.py'
      - '.github/workflows/protocol024-equivalence-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'
      - name: Install Protocol online dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          # requirements-online.txt records the validated workstation as dgl==2.0.0,
          # but that wheel is no longer available for CPython 3.8 on current PyPI.
          # The smoke path only needs the legacy dgl.graph + GATConv API, which is
          # present in 1.1.3. This is CI compatibility for an equivalence smoke,
          # not a re-registration of the formal experiment environment.
          python -m pip install dgl==1.1.3
      - name: Run fixed-vs-dynamic container smoke
        run: |
          python run_ftmoe_protocol024_equivalence_smoke.py \
            --intervals 24 \
            --out artifacts/ftmoe_online/protocol_024/continuation_20260914/ci_equivalence_smoke.json
      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol024-equivalence-smoke
          path: artifacts/ftmoe_online/protocol_024/continuation_20260914/ci_equivalence_smoke.json
          if-no-files-found: warn
