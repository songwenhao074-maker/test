name: Protocol044 dispatch once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol044-dispatch-once.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[p044-dispatch]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frozen Protocol044 science
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run protocol044-closeout-capacity.yml --repo "$GITHUB_REPOSITORY" --ref main -f execution_sha=0fb751738718d3d06aeeaa32cfcb593436fd7c87 -f engineering_artifact_id=11296492568 -f engineering_artifact_digest=sha256:90b6bab6a149c46da0aa19e551c02f76b5665a27a83e97d7de192e21e08b6591
          echo "dispatched 0fb751738718d3d06aeeaa32cfcb593436fd7c87"

# recovery dispatch after sealed pre-initialization generator repair
