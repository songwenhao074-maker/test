name: Protocol-024 v2c replacement-consistent qualification

on:
  workflow_dispatch:
  push:
    branches: [protocol-024-v2c-gpt56-20260916]
    paths:
      - 'ftmoe_protocol024_v2c.py'
      - 'run_ftmoe_protocol024_v2c.py'
      - 'test_ftmoe_protocol024_v2c.py'
      - 'artifacts/ftmoe_online/protocol_024/next_round_v2c/registration.json'
      - '.github/workflows/protocol024-v2c.yml'

permissions:
  contents: read
  actions: read

jobs:
  v2c-development:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      OMP_NUM_THREADS: '3'
      MKL_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '3'
      ROOT_OUT: artifacts/ftmoe_online/protocol_024/next_round_v2c
      STREAM_RUN_ID: '34953715809'
      STREAM_ARTIFACT: protocol024-next-round-v1-finalized-generation
      V2A_RUN_ID: '34989082187'
      V2A_ARTIFACT: protocol024-next-round-v2a-development
      V2B_RUN_ID: '35051303612'
      V2B_ARTIFACT: protocol024-next-round-v2b-development
      EXPECTED_STREAM_SHA: 468725ff2f164bee89017bfa329d63e20566659a42d2a0492e977e744c7ae946
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: pip
      - name: Install online dependencies with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/requirements-online-ci.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/requirements-online-ci.txt
          python -m pip install dgl==1.1.3
      - name: Download immutable seed700 stream
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.STREAM_ARTIFACT }}
          path: /tmp/p24-v2c-stream
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.STREAM_RUN_ID }}
      - name: Download v2a C-u4 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2A_ARTIFACT }}
          path: /tmp/p24-v2a
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V2A_RUN_ID }}
      - name: Download defective-v2b evidence for retained comparison
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V2B_ARTIFACT }}
          path: /tmp/p24-v2b
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V2B_RUN_ID }}
      - name: Verify immutable inputs and preregistration
        run: |
          python - <<'PY'
          import hashlib,json,numpy as np
          from pathlib import Path
          s=Path('/tmp/p24-v2c-stream')
          h=hashlib.sha256((s/'stream.npz').read_bytes()).hexdigest()
          assert h=='468725ff2f164bee89017bfa329d63e20566659a42d2a0492e977e744c7ae946'
          m=json.loads((s/'manifest.json').read_text())
          assert m['stream_sha256']==h and m['steps']==4980 and m['guard_rows']==1 and m['seed']==700
          with np.load(s/'stream.npz') as d:
              assert d['raw_labels'].shape==(4981,16)
          r=json.load(open('artifacts/ftmoe_online/protocol_024/next_round_v2c/registration.json'))
          assert r['registered_before_v2c_results'] is True
          assert r['stream']['replay_seed']==700 and r['stream']['model_seed']==1
          assert r['birth']['shadow_budget_version']=='buffer128_4x4'
          assert r['birth']['target_deployment_topology'].startswith('four generalists + new specialist')
          assert r['sealed']['confirmation_seeds']==[701,702,703]
          assert r['required_arms']==['C-u4','D-v2c','D-v2c-no-reuse']
          print(json.dumps({'stream_sha256':h,'registration':'v2c_frozen','simulator_rerun':False}))
          PY
      - name: Verify replacement implementation and regression tests
        run: |
          python -m py_compile ftmoe_protocol024_v2c.py run_ftmoe_protocol024_v2c.py
          python -m unittest -v \
            test_ftmoe_protocol024_v2c.py \
            test_ftmoe_protocol024_v2b.py \
            test_ftmoe_protocol024_v2a.py \
            test_ftmoe_protocol024_next_round_eval.py
      - name: Run bounded v2c replay and no-reuse diagnostic
        run: |
          OUT="$ROOT_OUT/runs/run_${GITHUB_RUN_ID}"
          python run_ftmoe_protocol024_v2c.py \
            --stream /tmp/p24-v2c-stream \
            --v2a-root /tmp/p24-v2a \
            --v2b-root /tmp/p24-v2b \
            --out-root "$OUT" \
            --github-run-id "$GITHUB_RUN_ID"
      - name: Add immutable stream manifest and run provenance
        if: always()
        run: |
          OUT="$ROOT_OUT/runs/run_${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          src=Path('/tmp/p24-v2c-stream'); out=Path(os.environ['ROOT_OUT'])/'runs'/('run_'+os.environ['GITHUB_RUN_ID'])
          payload={'source_run':34953715809,'source_artifact':'protocol024-next-round-v1-finalized-generation','stream_sha256':hashlib.sha256((src/'stream.npz').read_bytes()).hexdigest(),'manifest':json.loads((src/'manifest.json').read_text()),'simulator_rerun':False}
          (out/'immutable_stream_manifest.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
      - name: Upload v2c evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol024-v2c-development-${{ github.run_id }}
          path: |
            artifacts/ftmoe_online/protocol_024/next_round_v2c/registration.json
            artifacts/ftmoe_online/protocol_024/next_round_v2c/runs/run_${{ github.run_id }}
          if-no-files-found: warn
          compression-level: 6
