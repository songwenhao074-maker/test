      parent_state_id: ${{ needs.g29.outputs.state_id }}
      parent_receipt_id: ${{ needs.g29.outputs.receipt_id }}
      parent_receipt_sha: ${{ needs.g29.outputs.receipt_sha }}
      parent_cursor: ${{ needs.g29.outputs.next_t }}
      segment_index: "30"
    secrets: inherit
  data_seal:
    needs: g30
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTION_SHA: ${{ inputs.execution_sha }}
      EXECUTION_REF: codex/protocol-044-revision2-durable-recovery-20261005
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.18"
      - name: Install frozen runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/req.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/req.txt
          python -m pip install dgl==1.1.3 dill==0.3.8 psutil==5.9.8 wget==3.2 pandas==2.0.3 scikit-learn==1.3.2
          git worktree add --detach /tmp/source036 b620467aab4283e52d129924769c374124bbb4bf
      - name: Restore final committed generation state
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.g30.outputs.next_t }}" = "5953"
          mkdir -p /tmp/final /tmp/pr
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.g30.outputs.state_id }}" > /tmp/info.json
          DIG=$(python -c 'import json; print(json.load(open("/tmp/info.json"))["digest"].split(":",1)[1])')
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.g30.outputs.state_id }}/zip" -o /tmp/final.zip
          echo "$DIG  /tmp/final.zip" | sha256sum -c -
          unzip -q /tmp/final.zip -d /tmp/final
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.g30.outputs.receipt_id }}/zip" -o /tmp/pr.zip
          unzip -q /tmp/pr.zip -d /tmp/pr
          test "$(sha256sum /tmp/pr/receipt.json | awk '{print $1}')" = "${{ needs.g30.outputs.receipt_sha }}"
          python maintenance/protocol044_r2_durable.py verify --root /tmp/final --manifest /tmp/final/state_manifest.json
          python maintenance/protocol044_r2_durable.py verify-receipt --receipt /tmp/pr/receipt.json --manifest /tmp/final/state_manifest.json
          python maintenance/protocol044_r2_durable.py fresh-generation-restore --source036 /tmp/source036 --root /tmp/final --manifest /tmp/final/state_manifest.json
      - name: Fresh-process assemble and model-free audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/seal
          cp -a /tmp/final /tmp/seal/generation
          python protocol044_stream.py assemble --source036 /tmp/source036 --generation-root /tmp/seal/generation --output /tmp/seal/data
          python protocol044_stream.py audit --source036 /tmp/source036 --generation-root /tmp/seal/generation --data-root /tmp/seal/data --evidence-root /tmp/seal/evidence
          python - <<'PY'
          import hashlib,json,os,pathlib
          def sha(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for b in iter(lambda:f.read(1<<20),b""):h.update(b)
              return h.hexdigest()
          a=json.load(open("/tmp/seal/evidence/input_audit.json"));l=json.load(open("/tmp/seal/evidence/input_lock.json"));m=json.load(open("/tmp/seal/data/manifest.json"))
          assert a["audit_pass"] is True and l["locked"] is True and m["audit_pass"] is True
          assert sha("/tmp/seal/data/stream.npz")==l["stream_sha256"]==m["stream_sha256"]
          x={"protocol":"044","revision":1,"execution_revision":2,"science_config_revision":1,"seed":4401,
             "execution_sha":os.environ["EXECUTION_SHA"],"stream_sha256":l["stream_sha256"],
             "input_lock_sha256":sha("/tmp/seal/evidence/input_lock.json"),"manifest_sha256":sha("/tmp/seal/data/manifest.json"),
             "model_runs_started":0,"sealed_before_C":True}
          pathlib.Path("/tmp/seal/evidence/data_lock_r2.json").write_text(json.dumps(x,indent=2)+"\n")
          PY
          python maintenance/protocol044_r2_durable.py manifest --root /tmp/seal --kind data --execution-sha "$EXECUTION_SHA"             --parent-receipt /tmp/pr/receipt.json --out /tmp/seal/state_manifest.json
          python maintenance/protocol044_r2_durable.py verify --root /tmp/seal --manifest /tmp/seal/state_manifest.json             --expected-parent "${{ needs.g30.outputs.receipt_sha }}"
      - name: Upload immutable model-free data seal
        id: data_up
        uses: actions/upload-artifact@v4
        with:
          name: protocol044-r2-data-${{ github.run_id }}
          path: /tmp/seal
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
      - name: Fresh download data seal and create receipt
        shell: bash
        run: |
          set -euo pipefail
          ID="${{ steps.data_up.outputs.artifact-id }}"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" > /tmp/dinfo.json
          DIG=$(python -c 'import json; print(json.load(open("/tmp/dinfo.json"))["digest"].split(":",1)[1])')
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" -o /tmp/data.zip
          echo "$DIG  /tmp/data.zip" | sha256sum -c -
          mkdir /tmp/datafresh && unzip -q /tmp/data.zip -d /tmp/datafresh
          python maintenance/protocol044_r2_durable.py verify --root /tmp/datafresh --manifest /tmp/datafresh/state_manifest.json             --expected-parent "${{ needs.g30.outputs.receipt_sha }}"
          python maintenance/protocol044_r2_durable.py receipt --info /tmp/dinfo.json --manifest /tmp/datafresh/state_manifest.json             --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/data_receipt.json --parent /tmp/pr/receipt.json
          python maintenance/protocol044_r2_durable.py verify-receipt --receipt /tmp/data_receipt.json --manifest /tmp/datafresh/state_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: protocol044-r2-data-receipt-${{ github.run_id }}
          path: /tmp/data_receipt.json
          retention-days: 90
          compression-level: 6
      - name: Persist data receipt to execution branch
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch origin "$EXECUTION_REF"
          git worktree add /tmp/progress "origin/$EXECUTION_REF"
          cd /tmp/progress
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          P="artifacts/ftmoe_online/protocol_044/revision_002/progress/data_lock_receipt.json"
          mkdir -p "$(dirname "$P")"; cp /tmp/data_receipt.json "$P"
          git add "$P"; git commit -m "progress: Protocol044 r2 model-free data sealed [skip ci]"
          git push origin HEAD:"$EXECUTION_REF"
