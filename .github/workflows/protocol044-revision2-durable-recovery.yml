name: Protocol044 revision2 durable recovery generation
on:
  workflow_dispatch:
    inputs:
      execution_sha: {description: Exact frozen r2 execution SHA, required: true, type: string}
      gate_artifact_id: {description: E recovery gate artifact id, required: true, type: string}
      gate_digest: {description: E recovery gate zip sha256 digest, required: true, type: string}
permissions:
  contents: write
  actions: read
concurrency:
  group: protocol044_revision1_stageS_seed4401_sequence
  cancel-in-progress: false
jobs:
  init:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      state_id: ${{ steps.state_up.outputs.artifact-id }}
      receipt_id: ${{ steps.receipt_up.outputs.artifact-id }}
      receipt_sha: ${{ steps.commit.outputs.receipt_sha }}
      next_t: "0"
      state_digest: ${{ steps.commit.outputs.state_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXECUTION_SHA: ${{ inputs.execution_sha }}
      EXECUTION_REF: codex/protocol-044-revision2-durable-recovery-20261005
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.18"
      - name: Install frozen runtime and verify no prior r2 initialization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
          python -m pip install --upgrade pip
          grep -v '^torch==' requirements-online.txt | grep -v '^dgl==' > /tmp/req.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r /tmp/req.txt
          python -m pip install dgl==1.1.3 dill==0.3.8 psutil==5.9.8 wget==3.2 pandas==2.0.3 scikit-learn==1.3.2
          python - <<'PY'
          import json
          x=json.load(open("artifacts/ftmoe_online/protocol_044/revision_002/recovery_inventory.json"))
          assert x["branch_selected"]=="one_authorized_same_seed4401_from_zero_reconstruction"
          assert x["reconstruction_allowance_consumed"] is False
          PY
          git fetch origin "$EXECUTION_REF"
          P="artifacts/ftmoe_online/protocol_044/revision_002/progress/generation_cursor_0000.json"
          if git cat-file -e "origin/$EXECUTION_REF:$P" 2>/dev/null; then echo "r2 t0 already committed; refuse reinitialization"; exit 31; fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=protocol044-r2-generation-state0&per_page=100" > /tmp/existing.json
          python - <<'PY'
          import json
          x=json.load(open("/tmp/existing.json"))
          live=[a for a in x.get("artifacts",[]) if not a.get("expired")]
          assert not live,("existing r2 initialization artifact",[(a["id"],a["name"]) for a in live])
          PY
      - name: Verify E recovery gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gate
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ inputs.gate_artifact_id }}/zip" -o /tmp/gate.zip
          echo "${{ inputs.gate_digest }}" | sed 's/^sha256://' | awk '{print $1"  /tmp/gate.zip"}' | sha256sum -c -
          unzip -q /tmp/gate.zip -d /tmp/gate
          python - <<'PY'
          import json,os
          g=json.load(open("/tmp/gate/E_recovery_gate.json"))
          assert g["E_recovery_gate"] is True and g["execution_sha"]==os.environ["EXECUTION_SHA"] and g["fixture_mode"] is False
          PY
      - name: Materialize frozen Protocol036 source
        run: git worktree add --detach /tmp/source036 b620467aab4283e52d129924769c374124bbb4bf
      - name: Create initialization-only t0 simulator state
        run: |
          set -euo pipefail
          python protocol044_stream.py init --source036 /tmp/source036 --output /tmp/state0
          test "$(python -c 'import json; print(json.load(open("/tmp/state0/resume_manifest.json"))["next_t"])')" = "0"
          python maintenance/protocol044_r2_durable.py manifest --root /tmp/state0 --kind generation --execution-sha "$EXECUTION_SHA" --next-t 0 --out /tmp/state0/state_manifest.json
          python maintenance/protocol044_r2_durable.py verify --root /tmp/state0 --manifest /tmp/state0/state_manifest.json
          python maintenance/protocol044_r2_durable.py fresh-generation-restore --source036 /tmp/source036 --root /tmp/state0 --manifest /tmp/state0/state_manifest.json
      - id: state_up
        uses: actions/upload-artifact@v4
        with:
          name: protocol044-r2-generation-state0
          path: /tmp/state0
          retention-days: 90
          compression-level: 6
      - name: Fresh download t0 and build receipt
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          ID="${{ steps.state_up.outputs.artifact-id }}"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID" > /tmp/info.json
          DIG=$(python -c 'import json; print(json.load(open("/tmp/info.json"))["digest"].split(":",1)[1])')
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" -o /tmp/state0.zip
          echo "$DIG  /tmp/state0.zip" | sha256sum -c -
          mkdir /tmp/fresh && unzip -q /tmp/state0.zip -d /tmp/fresh
          python maintenance/protocol044_r2_durable.py verify --root /tmp/fresh --manifest /tmp/fresh/state_manifest.json
          python maintenance/protocol044_r2_durable.py fresh-generation-restore --source036 /tmp/source036 --root /tmp/fresh --manifest /tmp/fresh/state_manifest.json
          python maintenance/protocol044_r2_durable.py receipt --info /tmp/info.json --manifest /tmp/fresh/state_manifest.json             --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/receipt.json
          python maintenance/protocol044_r2_durable.py verify-receipt --receipt /tmp/receipt.json --manifest /tmp/fresh/state_manifest.json
          echo "receipt_sha=$(sha256sum /tmp/receipt.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "state_digest=$(python -c 'import json; print(json.load(open("/tmp/info.json"))["digest"])')" >> "$GITHUB_OUTPUT"
      - id: receipt_up
        uses: actions/upload-artifact@v4
        with:
          name: protocol044-r2-generation-receipt0
          path: /tmp/receipt.json
          retention-days: 90
          compression-level: 6
      - name: Persist t0 receipt to execution branch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$EXECUTION_REF"
          git worktree add /tmp/progress "origin/$EXECUTION_REF"
          cd /tmp/progress
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          P="artifacts/ftmoe_online/protocol_044/revision_002/progress/generation_cursor_0000.json"
          mkdir -p "$(dirname "$P")"; cp /tmp/receipt.json "$P"
          git add "$P"; git commit -m "progress: Protocol044 r2 generation initialized t0 [skip ci]"
          git push origin HEAD:"$EXECUTION_REF"
  g01:
    needs: init
    uses: ./.github/workflows/protocol044-r2-generation-segment-reusable.yml
    with:
      execution_sha: ${{ inputs.execution_sha }}
      gate_artifact_id: ${{ inputs.gate_artifact_id }}
      gate_digest: ${{ inputs.gate_digest }}
      parent_state_id: ${{ needs.init.outputs.state_id }}
      parent_receipt_id: ${{ needs.init.outputs.receipt_id }}
