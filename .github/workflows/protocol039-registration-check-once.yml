name: Protocol039 registration validation once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol039-registration-check-once.yml'

permissions:
  contents: read

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[p039-registration-check]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/protocol-039-d-vs-c-sleep-wake-20261002
          fetch-depth: 1
      - run: git rev-parse HEAD
      - run: python maintenance/validate_protocol039_plan.py
