name: Bootstrap Protocol034 resume

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-protocol034-resume.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch Protocol034 resume-only workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/protocol034-resume-after-reference.yml/dispatches" \
            -f ref=main \
            -f 'inputs[execution_ref]=codex/protocol-034-three-hypotheses-20260928' \
            -f 'inputs[source_run_id]=36429633413' \
            -f 'inputs[source_artifact_id]=10975657183'
